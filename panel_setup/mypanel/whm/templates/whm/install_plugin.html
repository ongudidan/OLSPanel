{% extends "whm/base.html" %}
{% block title %}Install Plugin{% endblock %}

{% block content %}

<div style="max-width:900px;margin:auto;padding:20px;">

    <!-- SKELETON (instant UI instead of blocking loader) -->
    <div id="loader" style="padding:20px;">
        <div style="height:20px;width:60%;background:#eee;margin-bottom:10px;"></div>
        <div style="height:12px;width:40%;background:#f0f0f0;margin-bottom:20px;"></div>
        <div style="width:40px;height:40px;border:4px solid #ddd;border-top:4px solid #0d6efd;border-radius:50%;margin:auto;animation:spin 1s linear infinite;"></div>
        <p style="text-align:center;">Loading plugin...</p>
    </div>

    <!-- PLUGIN -->
    <div id="pluginBox" style="display:none;"></div>

    <!-- TERMINAL -->
    <div id="terminal"
         style="display:none;margin-top:20px;background:#000;color:#00ff00;
         padding:15px;border-radius:12px;height:400px;overflow:auto;
         font-family:monospace;white-space:pre-wrap;">
    </div>

</div>

<style>
@keyframes spin {
    0% {transform:rotate(0deg);}
    100% {transform:rotate(360deg);}
}
</style>

<script>

const PLUGIN_ID = "{{ plugin_id }}";
let plugin = null;

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded", function () {
    loadPlugin();
});

/* =========================
   LOAD PLUGIN (async)
========================= */
function loadPlugin() {

    fetch(`{% url 'api_plugins' %}?id=${PLUGIN_ID}`)
        .then(res => res.json())
        .then(data => {

            plugin = data.plugins?.length ? data.plugins[0] : null;

            document.getElementById("loader").style.display = "none";
            document.getElementById("pluginBox").style.display = "block";

            renderPlugin();
        })
        .catch(() => {
            document.getElementById("loader").innerHTML =
                "❌ Failed to load plugin";
        });
}

/* =========================
   RENDER PLUGIN
========================= */
function renderPlugin() {

    const box = document.getElementById("pluginBox");

    if (!plugin) {
        box.innerHTML = "<p>Plugin not found</p>";
        return;
    }
    let licenseBadges = "";

    if (plugin.type) {
        licenseBadges = plugin.type.split(",").map(t => {

            t = t.trim();
            let label = t.charAt(0).toUpperCase() + t.slice(1);

            let color = "#6c757d";
            if (t === "free") color = "#198754";
            if (t === "basic") color = "#0d6efd";
            if (t === "pro") color = "#fd7e14";
            if (t === "enterprise") color = "#6f42c1";

            return `
                <span style="
                    background:${color};
                    color:#fff;
                    padding:4px 10px;
                    border-radius:20px;
                    font-size:12px;
                    font-weight:600;
                    margin-right:5px;
                ">
                    ${label}
                </span>
            `;
        }).join("");
    }
	
    let btn = "";

    if (plugin.license_valid === false) {

        btn = `
            <a href="/whm/license/"
               style="display:block;background:#dc3545;color:#fff;padding:12px;text-align:center;border-radius:10px;font-weight:bold;">
                🔒 Unlock License Required
            </a>
        `;

    } else if (plugin.is_installed) {

        btn = `
            <div style="background:#198754;color:#fff;padding:12px;text-align:center;border-radius:10px;font-weight:bold;">
                ✅ Already Installed
            </div>
        `;

    } else {

        btn = `
            <button id="installBtn"
                onclick="startInstall()"
                style="width:100%;background:#fd7e14;color:#fff;padding:12px;
                border:none;border-radius:10px;font-weight:bold;">
                🚀 Install Plugin
            </button>
        `;
    }

    box.innerHTML = `
        <div style="background:#fff;padding:20px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.08);">

            <h2>${plugin.name}</h2>
            <p style="color:#666;">${plugin.category}</p>
<!-- ✅ ADD THIS -->
        <div style="margin-bottom:10px;">
            ${licenseBadges}
        </div>
            <img src="${plugin.image || '/media/icon/plugin.png'}"
                 loading="lazy"
                 decoding="async"
                 style="width:100%;height:220px;object-fit:contain;background:#f8f9fa;border-radius:10px;padding:10px;">

            <div style="margin-top:15px;">
                ${btn}
            </div>

        </div>
    `;
}

/* =========================
   INSTALL STREAM (OPTIMIZED)
========================= */
function startInstall() {

    const terminal = document.getElementById("terminal");
    const btn = document.getElementById("installBtn");

    if (btn) btn.style.display = "none";

    terminal.style.display = "block";
    terminal.textContent = "🚀 Starting installation...\n\n";

    fetch(`/whm/install_plugin_run/${PLUGIN_ID}/`)
        .then(async res => {

            const reader = res.body.getReader();
            const decoder = new TextDecoder("utf-8");

            let buffer = "";
            let outputBuffer = "";

            function flush() {
                if (outputBuffer) {
                    terminal.textContent += outputBuffer;
                    outputBuffer = "";
                    terminal.scrollTop = terminal.scrollHeight;
                }
            }

            async function read() {
                const { done, value } = await reader.read();

                if (done) {
                    flush();
                    terminal.textContent += "\n\n✅ DONE";
                    return;
                }

                buffer += decoder.decode(value, { stream: true });

                let lines = buffer.split("\n");
                buffer = lines.pop();

                for (let line of lines) {
                    if (line.trim()) {
                        outputBuffer += line + "\n";
                    }
                }

                flush();
                requestAnimationFrame(read);
            }

            read();
        })
        .catch(err => {
            terminal.textContent += "\n❌ ERROR: " + err;
        });
}

</script>

{% endblock %}
