{% extends "whm/base.html" %}
{% block title %}Change Password{% endblock title %}
{% block content %}

<div class="max-w-lg bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden mb-5">
    <div class="px-4 py-3 bg-white border-b border-slate-200">
        <h4 class="text-base font-semibold text-slate-900 m-0 flex items-center gap-2">
            <i class="mdi mdi-key-outline text-brand"></i> Change Admin Password
        </h4>
    </div>
    <div class="p-5">
        <form method="POST" autocomplete="off" class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="id_old_password" class="block text-xs font-semibold text-slate-700 mb-1">Current Password</label>
                <input type="password" name="old_password" id="id_old_password" required placeholder="Enter current password" autocomplete="current-password" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
            </div>

            <div>
                <label for="id_new_password1" class="block text-xs font-semibold text-slate-700 mb-1">New Password</label>
                <input type="password" name="new_password1" id="id_new_password1" required placeholder="Enter new password (min. 6 characters)" autocomplete="new-password" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
            </div>

            <div>
                <label for="id_new_password2" class="block text-xs font-semibold text-slate-700 mb-1">Confirm New Password</label>
                <input type="password" name="new_password2" id="id_new_password2" required placeholder="Re-enter new password" autocomplete="new-password" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
            </div>

            <div class="pt-2">
                <button type="submit" id="reset" class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-brand hover:bg-brand/90 rounded-md shadow-xs transition-colors">
                    <i class="mdi mdi-check"></i> Update Password
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock content %}
