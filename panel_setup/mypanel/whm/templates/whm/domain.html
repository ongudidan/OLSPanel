{% extends "whm/base.html" %}
{% block title %}Add New Domain{% endblock title %}

{% block content %}
<div class="max-w-2xl">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-visible">
        <!-- Card Header -->
        <div class="px-5 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between">
            <h4 class="text-sm font-semibold text-slate-900 m-0 flex items-center gap-2">
                <i class="mdi mdi-web-plus text-brand text-base"></i> Add New Domain
            </h4>
            <a href="{% url 'domain_list_all' %}" class="inline-flex items-center gap-1 text-xs font-semibold text-slate-500 hover:text-brand transition-colors">
                <i class="mdi mdi-arrow-left"></i> Back to Domains
            </a>
        </div>

        <!-- Form Body -->
        <div class="p-5">
            <form method="post" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}

                <!-- Owner Account & PHP Version Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="block text-xs font-semibold text-slate-700" for="xuser">Domain Owner Account <span class="text-rose-500">*</span></label>
                        <div>
                            <select name="user" id="xuser" required class="searchable-select w-full" data-placeholder="Select account..." data-search-placeholder="Search users..." data-icon="mdi-account-outline">
                                {% for auser in all_user %}
                                    <option value="{{ auser.username }}">{{ auser.username }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="block text-xs font-semibold text-slate-700" for="php_version">PHP Handler Version <span class="text-rose-500">*</span></label>
                        <div>
                            <select name="php_version" id="php_version" class="searchable-select w-full" data-placeholder="Select PHP version..." data-search-placeholder="Search PHP versions..." data-icon="mdi-language-php">
                                {% for version in php_versions %}
                                    <option value="{{ version }}">PHP {{ version }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Domain Name -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-slate-700" for="id_domain">Domain Name (FQDN) <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <i class="mdi mdi-web absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" name="domain" id="id_domain" required placeholder="example.com" class="w-full pl-8 pr-2.5 py-2 bg-white border border-slate-200 rounded-md text-xs font-mono font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all" autocomplete="off">
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1">Fully qualified domain name without <span class="font-mono text-[11px] font-semibold text-slate-600 bg-slate-100 px-1 py-0.5 rounded border border-slate-200">http://</span> or <span class="font-mono text-[11px] font-semibold text-slate-600 bg-slate-100 px-1 py-0.5 rounded border border-slate-200">www</span>.</p>
                </div>

                <!-- Document Root Options -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-slate-700" for="id_path">Document Root Directory</label>
                    <div class="relative">
                        <i class="mdi mdi-folder-outline absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" name="path" id="id_path" class="w-full pl-8 pr-2.5 py-2 bg-white border border-slate-200 rounded-md text-xs font-mono text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all" placeholder="/public_html">
                    </div>
                    <div class="pt-1.5">
                        <label class="inline-flex items-center gap-1.5 cursor-pointer text-xs text-slate-600 select-none">
                            <input type="checkbox" id="dtype" name="dtype" class="w-3.5 h-3.5 rounded border-slate-300 text-brand focus:ring-brand cursor-pointer">
                            <span id="docRootLabel">Share primary root directory (<span class="font-mono text-[11px] font-semibold text-slate-700 bg-slate-100 px-1 py-0.5 rounded border border-slate-200">/public_html</span>)</span>
                        </label>
                    </div>
                </div>

                <!-- Actions -->
                <div class="pt-2">
                    <button type="submit" class="btn btn-secondary inline-flex items-center gap-1.5 px-4 py-2 hover:/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors cursor-pointer">
                        <i class="mdi mdi-plus-circle-outline"></i> Create Domain
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function initWhmDomainForm() {
    const checkbox = document.getElementById("dtype");
    const domainInput = document.getElementById("id_domain");
    const pathInput = document.getElementById("id_path");
    const userSelect = document.getElementById("xuser");
    const label = document.getElementById("docRootLabel");

    if (window.OLSSelect) {
        window.OLSSelect.initAll(document.getElementById('spa-content') || document);
    }

    function updatePath() {
        if (!pathInput || !domainInput) return;
        if (checkbox && checkbox.checked) {
            pathInput.value = "/public_html";
        } else {
            let domain = domainInput.value.trim().replace(/\s+/g, '').replace(/^www\./, '');
            if (domain) {
                pathInput.value = `/${domain}`;
            } else {
                pathInput.value = "";
            }
        }
    }

    function updateLabel() {
        if (!userSelect || !label) return;
        const selectedUser = userSelect.value || "user";
        label.innerHTML = `Share primary root directory (<span class="font-mono text-[11px] font-semibold text-slate-700 bg-slate-100 px-1 py-0.5 rounded border border-slate-200">/home/${selectedUser}/public_html</span>)`;
    }

    checkbox?.addEventListener("change", updatePath);
    domainInput?.addEventListener("input", function () {
        if (!checkbox || !checkbox.checked) {
            updatePath();
        }
    });

    userSelect?.addEventListener("change", updateLabel);
    userSelect?.addEventListener("input", updateLabel);

    updatePath();
    updateLabel();
})();
</script>

{% include "whm/footer.html" %}
{% endblock content %}
