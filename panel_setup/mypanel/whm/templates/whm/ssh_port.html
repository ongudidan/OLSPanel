{% extends "whm/base.html" %}
{% block title %}SSH Port{% endblock title %}
{% block content %}

<div class="max-w-xl bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden mb-5">
    <div class="px-4 py-3 bg-white border-b border-slate-200">
        <h4 class="text-base font-semibold text-slate-900 m-0 flex items-center gap-2">
            <i class="mdi mdi-console-network text-brand"></i> Change SSH Port
        </h4>
    </div>
    <div class="p-5">
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="port" class="block text-xs font-semibold text-slate-700 mb-1">SSH Port</label>
                <input type="number" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all" id="port" name="port" value="{{ port }}" required>
                <div class="text-[11px] text-slate-500 mt-2">
                    Default SSH port is <code class="font-mono bg-slate-100 px-1 py-0.5 rounded text-slate-800 border border-slate-200">22</code>. Changing to a custom port (e.g. <code class="font-mono bg-slate-100 px-1 py-0.5 rounded text-slate-800 border border-slate-200">2222</code> or <code class="font-mono bg-slate-100 px-1 py-0.5 rounded text-slate-800 border border-slate-200">30</code>) enhances security by mitigating automated brute-force attacks.
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-brand hover:bg-brand/90 rounded-md shadow-xs transition-colors">
                    <i class="mdi mdi-content-save-outline"></i> Save SSH Port
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock content %}
