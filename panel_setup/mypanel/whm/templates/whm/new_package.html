{% extends "whm/base.html" %}
{% block title %}{{ title }} Package{% endblock title %}

{% block content %}
<div class="max-w-2xl bg-white border border-slate-200 rounded-lg shadow-sm mb-5">
    <div class="px-4 py-3 bg-white border-b border-slate-200">
        <h4 class="text-base font-semibold text-slate-900 m-0 flex items-center gap-2">
            <i class="mdi mdi-package-variant-closed text-brand"></i> {{ title }} Package
        </h4>
    </div>
    <div class="p-5">
        <form method="post" action="" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label for="pkg_name" class="block text-xs font-semibold text-slate-700 mb-1">Package Name <span class="text-rose-500">*</span></label>
                <input type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="pkg_name" name="name" value="{{ pk.name|default:'' }}" placeholder="e.g. Standard" required>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label for="disk_space" class="block text-xs font-semibold text-slate-700 mb-1">Disk Space (MB)</label>
                    <input name="disk_space" type="number" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="disk_space" value="{{ pk.disk_space|default:'0' }}" placeholder="0 for unlimited" required>
                    <span class="text-slate-400 text-[11px]">Enter 0 for Unlimited</span>
                </div>
                <div>
                    <label for="bandwidth" class="block text-xs font-semibold text-slate-700 mb-1">Bandwidth (MB)</label>
                    <input name="bandwidth" type="number" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="bandwidth" value="{{ pk.bandwidth|default:'0' }}" placeholder="0 for unlimited" required>
                    <span class="text-slate-400 text-[11px]">Enter 0 for Unlimited</span>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label for="email_accounts" class="block text-xs font-semibold text-slate-700 mb-1">Email Accounts</label>
                    <input type="number" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="email_accounts" name="email_accounts" placeholder="0 for unlimited" value="{{ pk.email_accounts|default:'0' }}" required>
                </div>
                <div>
                    <label for="databases" class="block text-xs font-semibold text-slate-700 mb-1">Databases</label>
                    <input type="number" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="databases" name="databases" placeholder="0 for unlimited" value="{{ pk.databases|default:'0' }}" required>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label for="ftp_accounts" class="block text-xs font-semibold text-slate-700 mb-1">FTP Accounts</label>
                    <input type="number" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="ftp_accounts" name="ftp_accounts" value="{{ pk.ftp_accounts|default:'0' }}" placeholder="0 for unlimited" required>
                </div>
                <div>
                    <label for="allowed_domains" class="block text-xs font-semibold text-slate-700 mb-1">Allowed Domains</label>
                    <input type="number" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="allowed_domains" name="allowed_domains" value="{{ pk.allowed_domains|default:'0' }}" placeholder="0 for unlimited" required>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label for="allowed_subdomains" class="block text-xs font-semibold text-slate-700 mb-1">Allowed Sub Domains</label>
                    <input type="number" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="allowed_subdomains" name="allowed_subdomains" value="{{ pk.allowed_subdomains|default:'0' }}" placeholder="0 for unlimited" required>
                </div>
                <div>
                    <label for="limit_action" class="block text-xs font-semibold text-slate-700 mb-1">Limit Exceeded Action</label>
                    <select class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="limit_action" name="limit_action" required>
                        <option value="0" {% if pk.enforce_disk_limits == 0 %}selected{% endif %}>Keep Active</option>
                        <option value="1" {% if pk.enforce_disk_limits == 1 %}selected{% endif %}>Suspend</option>
                    </select>
                </div>
            </div>

            <div class="pt-3 flex items-center gap-2">
                <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-md shadow-sm transition-all">
                    <i class="mdi mdi-check mr-1"></i> {{ title }} Package
                </button>
                <a href="{% url 'package_list' %}" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-md transition-all">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
