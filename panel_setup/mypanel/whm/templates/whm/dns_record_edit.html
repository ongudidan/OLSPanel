{% extends "whm/base.html" %}
{% block title %}Edit DNS Record - {{ dns.name }}{% endblock title %}
{% block content %}

<div class="max-w-2xl">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-visible">
        <div class="px-5 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between">
            <h4 class="text-sm font-semibold text-slate-900 m-0 flex items-center gap-2">
                <i class="mdi mdi-dns-outline text-brand text-base"></i> Edit DNS Record
            </h4>
            <a href="{% if dns.domain_id %}{% url 'dns_list_all' dns.domain_id %}{% else %}{% url 'dns_all' %}{% endif %}" class="inline-flex items-center gap-1 text-xs font-semibold text-slate-500 hover:text-brand transition-colors">
                <i class="mdi mdi-arrow-left"></i> Back to DNS Records
            </a>
        </div>

        <div class="p-5">
            <form method="post" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}
                
                <!-- DNS Record Name -->
                <div>
                    <label for="dns_name" class="block text-xs font-semibold text-slate-700 mb-1">Record Host / Name</label>
                    <input type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all" id="dns_name" name="dns_name" value="{{ dns.name }}" required>
                </div>

                <!-- Record Value / Destination -->
                <div>
                    <label for="dns_value" class="block text-xs font-semibold text-slate-700 mb-1">Destination Address / Value</label>
                    <input type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all" id="dns_value" name="dns_value" value="{{ dns.content }}" required>
                </div>

                <!-- Record Type & TTL Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="type" class="block text-xs font-semibold text-slate-700 mb-1">Record Type</label>
                        <select class="w-full searchable-select font-mono font-semibold" name="type" id="type">
                            <option value="A" {% if dns.type == "A" %}selected{% endif %}>A (IPv4 Address)</option>
                            <option value="AAAA" {% if dns.type == "AAAA" %}selected{% endif %}>AAAA (IPv6 Address)</option>
                            <option value="CNAME" {% if dns.type == "CNAME" %}selected{% endif %}>CNAME (Canonical Alias)</option>
                            <option value="MX" {% if dns.type == "MX" %}selected{% endif %}>MX (Mail Exchanger)</option>
                            <option value="TXT" {% if dns.type == "TXT" %}selected{% endif %}>TXT (Text Record)</option>
                            <option value="CAA" {% if dns.type == "CAA" %}selected{% endif %}>CAA (Certificate Authority)</option>
                            <option value="SRV" {% if dns.type == "SRV" %}selected{% endif %}>SRV (Service Record)</option>
                            <option value="NS" {% if dns.type == "NS" %}selected{% endif %}>NS (Nameserver)</option>
                            <option value="SOA" {% if dns.type == "SOA" %}selected{% endif %}>SOA (Start of Authority)</option>
                        </select>
                    </div>

                    <div>
                        <label for="ttl" class="block text-xs font-semibold text-slate-700 mb-1">TTL (Seconds)</label>
                        <input type="number" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all" id="ttl" name="ttl" value="{{ dns.ttl }}" required>
                    </div>
                </div>

                <!-- MX Priority (Conditional) -->
                <div id="prio-container" {% if dns.type != "MX" %}style="display: none;"{% endif %}>
                    <label for="prio" class="block text-xs font-semibold text-slate-700 mb-1">MX Priority</label>
                    <input type="number" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all" id="prio" name="prio" value="{{ dns.prio|default:10 }}">
                </div>

                <!-- Actions -->
                <div class="pt-2">
                    <button type="submit" class="btn btn-secondary inline-flex items-center gap-1.5 px-4 py-2 hover:/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors cursor-pointer">
                        <i class="mdi mdi-content-save-outline"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    function initDnsEditForm() {
        const typeSelect = document.getElementById('type');
        const prioContainer = document.getElementById('prio-container');

        function togglePrioInput() {
            if (!typeSelect || !prioContainer) return;
            prioContainer.style.display = (typeSelect.value === 'MX') ? 'block' : 'none';
        }

        typeSelect?.addEventListener('change', togglePrioInput);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initDnsEditForm);
    } else {
        initDnsEditForm();
    }
})();
</script>

{% include "whm/footer.html" %}
{% endblock content %}
