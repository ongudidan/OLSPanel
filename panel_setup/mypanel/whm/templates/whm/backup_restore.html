{% extends "whm/base.html" %}
{% block title %}Restore Backup{% endblock title %}
{% block content %}

<div id="responseContainer" style="display: none;" class="p-3 bg-sky-50 border border-sky-200 text-sky-800 rounded-lg text-xs flex items-center gap-2 mb-4">
    <svg class="animate-spin h-4 w-4 text-sky-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
    <span>Backup restore running. Do not navigate away, please wait...</span>
</div>

<div id="alertContainer" style="display: none;" class="p-3 rounded-lg text-xs flex items-center justify-between mb-4">
    <div id="message"></div>
    <button type="button" onclick="document.getElementById('alertContainer').style.display='none'" class="text-slate-400 hover:text-slate-600 text-sm font-bold bg-transparent border-0">&times;</button>
</div>

<div class="max-w-3xl bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden mb-5">
    <div class="px-4 py-3 bg-white border-b border-slate-200">
        <h4 class="text-base font-semibold text-slate-900 m-0 flex items-center gap-2">
            <i class="mdi mdi-backup-restore text-brand"></i> Restore Account Backup
        </h4>
    </div>
    <div class="p-5">
        <form action="#" method="POST" id="restoreBackupForm" onsubmit="event.preventDefault(); return false;" class="space-y-5">
            {% csrf_token %}

            <!-- Section 1: Backup Location -->
            <div>
                <div class="text-xs font-bold text-slate-900 uppercase tracking-wider pb-2 mb-3 border-b border-slate-100 flex items-center gap-1.5">
                    <i class="mdi mdi-map-marker-path text-brand text-sm"></i> 1. Backup Location &amp; Source
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mb-3">
                    <label class="flex items-center gap-2 p-2.5 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer text-xs font-medium text-slate-700 hover:bg-slate-100 transition-colors">
                        <input type="radio" name="backup_type" value="local" onchange="toggleFtpFields()" class="text-brand focus:ring-brand">
                        <span class="truncate"><i class="mdi mdi-folder-home-outline text-brand"></i> Local</span>
                    </label>
                    <label class="flex items-center gap-2 p-2.5 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer text-xs font-medium text-slate-700 hover:bg-slate-100 transition-colors">
                        <input type="radio" name="backup_type" value="upload" onchange="toggleFtpFields()" class="text-brand focus:ring-brand">
                        <span class="truncate"><i class="mdi mdi-upload text-brand"></i> Upload</span>
                    </label>
                    <label class="flex items-center gap-2 p-2.5 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer text-xs font-medium text-slate-700 hover:bg-slate-100 transition-colors">
                        <input type="radio" name="backup_type" value="url" onchange="toggleFtpFields()" class="text-brand focus:ring-brand">
                        <span class="truncate"><i class="mdi mdi-link-variant text-brand"></i> From URL</span>
                    </label>
                    <label class="flex items-center gap-2 p-2.5 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer text-xs font-medium text-slate-700 hover:bg-slate-100 transition-colors">
                        <input type="radio" name="backup_type" value="ftp" onchange="toggleFtpFields()" class="text-brand focus:ring-brand">
                        <span class="truncate"><i class="mdi mdi-server-network text-indigo-600"></i> FTP</span>
                    </label>
                </div>

                <!-- Local Backup File Selector -->
                <div id="sbackup" style="display: none;" class="mt-3">
                    <label for="backup-files-select" class="block text-xs font-semibold text-slate-700 mb-1">Select Local Backup Archive</label>
                    <select id="backup-files-select" name="backup-files-select" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                    </select>
                </div>

                <!-- FTP Fields -->
                <div class="ftp-fields mt-3 p-3.5 bg-slate-50 border border-slate-200 rounded-lg text-xs" style="display: none;">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label for="ftp_host" class="block font-semibold text-slate-700 mb-1">FTP Host</label>
                            <input type="text" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all" id="ftp_host" name="ftp_host" placeholder="ftp.example.com">
                        </div>
                        <div>
                            <label for="ftp_user" class="block font-semibold text-slate-700 mb-1">FTP Username</label>
                            <input type="text" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all" id="ftp_user" name="ftp_user" placeholder="username">
                        </div>
                        <div>
                            <label for="ftp_pass" class="block font-semibold text-slate-700 mb-1">FTP Password</label>
                            <input type="password" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all" id="ftp_pass" name="ftp_pass" placeholder="••••••••">
                        </div>
                    </div>
                    <div class="mt-3 text-right">
                        <button class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-white bg-brand hover:bg-brand/90 rounded-md shadow-xs transition-colors" type="button" onclick="fatchbackup('ftp');">
                            <i class="mdi mdi-download"></i> Fetch Backup Files
                        </button>
                    </div>
                </div>

                <!-- Upload File -->
                <div id="upload" style="display: none;" class="mt-3 p-3.5 bg-slate-50 border border-slate-200 rounded-lg text-xs space-y-2">
                    <label for="bk_up" class="block font-semibold text-slate-700">Upload Backup Archive (.zip, .tar, .tar.gz)</label>
                    <div class="flex items-center rounded-md shadow-xs">
                        <input type="file" id="bk_up" name="bk_up" accept=".zip,.tar,.gz" class="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-l-md text-xs text-slate-800 focus:outline-none focus:border-brand transition-all">
                        <button type="button" id="upload-button" class="inline-flex items-center gap-1 px-3.5 py-2 bg-brand hover:bg-brand/90 text-white border border-l-0 border-brand rounded-r-md text-xs font-semibold whitespace-nowrap transition-colors">
                            <i class="mdi mdi-upload"></i> Start Upload &amp; Restore
                        </button>
                    </div>
                    <div id="file-preview" class="file-preview mt-2"></div>
                </div>

                <!-- URL Import -->
                <div id="curl" style="display: none;" class="mt-3 p-3.5 bg-slate-50 border border-slate-200 rounded-lg text-xs space-y-2">
                    <label for="url-input" class="block font-semibold text-slate-700">Import Backup from Direct URL</label>
                    <div class="flex items-center rounded-md shadow-xs">
                        <input type="text" id="url-input" name="url-input" placeholder="https://example.com/backup.zip" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-l-md text-xs text-slate-800 focus:outline-none focus:border-brand transition-all">
                        <button type="button" id="upload-button-url" class="inline-flex items-center gap-1 px-3.5 py-2 bg-brand hover:bg-brand/90 text-white border border-l-0 border-brand rounded-r-md text-xs font-semibold whitespace-nowrap transition-colors">
                            <i class="mdi mdi-cloud-download"></i> Fetch &amp; Restore
                        </button>
                    </div>
                    <div class="upload-item mt-2">
                        <div id="prog" class="w-full h-2 bg-slate-200 rounded-full overflow-hidden" style="display: none;">
                            <div class="progress-bar bg-brand h-full rounded-full transition-all duration-300" style="width: 0%;"></div>
                        </div>
                        <div class="progress-percentage text-[11px] text-slate-500 font-semibold mt-1" style="display: none;">0%</div>
                    </div>
                </div>
            </div>

            <!-- Section 2: Format & Scope -->
            <div>
                <div class="text-xs font-bold text-slate-900 uppercase tracking-wider pb-2 mb-3 border-b border-slate-100 flex items-center gap-1.5">
                    <i class="mdi mdi-format-list-checks text-brand text-sm"></i> 2. Backup Format &amp; Scope
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-3">
                    <div>
                        <label for="common_options" class="block text-xs font-semibold text-slate-700 mb-1">Backup Archive Format</label>
                        <select id="common_options" name="category" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                            <option value="default">Default</option>
                            <option value="cpanel">cPanel Archive</option>
                            <option value="cyberpanel">CyberPanel</option>
                            <option value="pleask">Plesk Panel</option>
                        </select>
                    </div>
                    <div>
                        <label for="dbpassc" class="block text-xs font-semibold text-slate-700 mb-1">New Account Password</label>
                        <div class="flex items-center rounded-md shadow-xs">
                            <input type="text" id="dbpassc" name="dbpassc" placeholder="{{ tips|default:'Set new password...' }}" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-l-md text-xs text-slate-800 focus:outline-none focus:border-brand transition-all">
                            <button id="gen" type="button" onclick="generateAndFillPassword();" class="inline-flex items-center gap-1 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-l-0 border-slate-200 rounded-r-md text-xs font-semibold whitespace-nowrap transition-colors">
                                <i class="mdi mdi-refresh"></i> Generate
                            </button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Restore Scope</label>
                    <div class="flex flex-wrap gap-4 p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                        <label class="inline-flex items-center gap-1.5 cursor-pointer font-bold text-slate-900">
                            <input type="checkbox" id="full_backup" name="backup_option" value="full" onchange="toggleFullBackup(this)" checked class="rounded border-slate-300 text-brand focus:ring-brand">
                            <span>Full Backup</span>
                        </label>
                        <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-700">
                            <input type="checkbox" class="backup-option rounded border-slate-300 text-brand focus:ring-brand" name="backup_option" value="database" checked>
                            <span>Database</span>
                        </label>
                        <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-700">
                            <input type="checkbox" class="backup-option rounded border-slate-300 text-brand focus:ring-brand" name="backup_option" value="email" checked>
                            <span>Email</span>
                        </label>
                        <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-700">
                            <input type="checkbox" class="backup-option rounded border-slate-300 text-brand focus:ring-brand" name="backup_option" value="dns" checked>
                            <span>DNS</span>
                        </label>
                        <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-700">
                            <input type="checkbox" class="backup-option rounded border-slate-300 text-brand focus:ring-brand" name="backup_option" value="files" checked>
                            <span>Files</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Action Button for Local / Fetched file -->
            <div id="file_name" class="pt-2" style="display: none;">
                <button class="inline-flex items-center gap-1.5 px-5 py-2.5 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-md shadow-xs transition-colors" type="button" onclick="issuebackup();">
                    <i class="mdi mdi-play"></i> Start Backup Restore
                </button>
            </div>
        </form>
    </div>
</div>

<script>
var csrfToken = "{{ csrf_token }}";
var upload_url = "{% url 'upload_bk' %}";
var upload_url_from_url = "{% url 'upload_from_url_bk' %}";

function toggleFtpFields() {
    var checkedRadio = document.querySelector('input[name="backup_type"]:checked');
    if (!checkedRadio) return;
    var backupType = checkedRadio.value;

    var ftpFields = document.querySelector('.ftp-fields');
    var uploadSection = document.getElementById('upload');
    var urlSection = document.getElementById('curl');
    var localFileSelect = document.getElementById('file_name');
    var sbackup = document.getElementById('sbackup');

    if (ftpFields) ftpFields.style.display = 'none';
    if (uploadSection) uploadSection.style.display = 'none';
    if (urlSection) urlSection.style.display = 'none';
    if (localFileSelect) localFileSelect.style.display = 'none';
    if (sbackup) sbackup.style.display = 'none';

    if (backupType === 'ftp') {
        if (ftpFields) ftpFields.style.display = 'block';
    } else if (backupType === 'local') {
        if (sbackup) sbackup.style.display = 'block';
        if (localFileSelect) localFileSelect.style.display = 'block';
        fatchbackup('local');
    } else if (backupType === 'upload') {
        if (uploadSection) uploadSection.style.display = 'block';
    } else if (backupType === 'url') {
        if (urlSection) urlSection.style.display = 'block';
    }
}

function toggleFullBackup(fullBackupCheckbox) {
    var backupOptions = document.querySelectorAll('.backup-option');
    backupOptions.forEach(function(option) {
        option.checked = fullBackupCheckbox.checked;
    });
}

function issuebackup(backupfile) {
    backupfile = backupfile || "";
    var responseDisplay = document.getElementById('responseContainer');
    var alertContainer = document.getElementById('alertContainer');
    var messageDisplay = document.getElementById('message');

    if (!backupfile) {
        var sel = document.querySelector('[name="backup-files-select"]');
        backupfile = sel ? sel.value : "";
    }
    var backupOptions = Array.from(document.querySelectorAll('input[name="backup_option"]:checked')).map(function(option) { return option.value; });
    var checkedRadio = document.querySelector('input[name="backup_type"]:checked');
    var backupType = checkedRadio ? checkedRadio.value : "";
    var ftpHostElem = document.querySelector('[name="ftp_host"]');
    var ftpUserElem = document.querySelector('[name="ftp_user"]');
    var ftpPassElem = document.querySelector('[name="ftp_pass"]');
    var categoryElem = document.querySelector('[name="category"]');
    var passElem = document.querySelector('[name="dbpassc"]');

    var ftpHost = ftpHostElem ? ftpHostElem.value : "";
    var ftpUser = ftpUserElem ? ftpUserElem.value : "";
    var ftpPass = ftpPassElem ? ftpPassElem.value : "";
    var category = categoryElem ? categoryElem.value : "default";
    var pass = passElem ? passElem.value : "";

    if (responseDisplay) responseDisplay.style.display = 'flex';
    if (alertContainer) alertContainer.style.display = 'none';

    var formData = new FormData();
    formData.append('backup_file', backupfile);
    formData.append('type', backupOptions.join(','));
    if (backupType === 'ftp') {
        formData.append('ftp_host', ftpHost);
        formData.append('ftp_user', ftpUser);
        formData.append('ftp_pass', ftpPass);
    }
    formData.append('category', category);
    formData.append('pass', pass);

    fetch('{% url "backup_restore_start" %}', {
        method: 'POST',
        headers: { "X-CSRFToken": csrfToken },
        body: formData
    })
    .then(function(response) {
        if (responseDisplay) responseDisplay.style.display = 'none';
        if (!response.ok) {
            messageDisplay.innerText = response.statusText;
            throw new Error('Network response was not ok: ' + response.statusText);
        }
        return response.json();
    })
    .then(function(responseData) {
        var message = responseData.message || "Operation completed.";
        if (alertContainer) alertContainer.style.display = "flex";
        if (responseData.status === 'success') {
            alertContainer.className = "p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-lg text-xs flex items-center justify-between mb-4";
            messageDisplay.innerText = message;
        } else {
            alertContainer.className = "p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs flex items-center justify-between mb-4";
            messageDisplay.innerText = message;
        }
    })
    .catch(function(error) {
        if (responseDisplay) responseDisplay.style.display = 'none';
        if (alertContainer) {
            alertContainer.style.display = "flex";
            alertContainer.className = "p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs flex items-center justify-between mb-4";
            messageDisplay.innerText = error.toString();
        }
    });
}

function fatchbackup(type) {
    var file_id = document.getElementById('file_name');
    var responseDisplay = document.getElementById('responseContainer');
    var alertContainer = document.getElementById('alertContainer');
    var messageDisplay = document.getElementById('message');
    var sbackup = document.getElementById('sbackup');

    if (sbackup) sbackup.style.display = 'block';
    if (responseDisplay) responseDisplay.style.display = 'flex';
    if (alertContainer) alertContainer.style.display = "none";
    if (file_id) file_id.style.display = "none";

    var formData = new FormData();
    formData.append('fetch_type', type);
    if (type === 'ftp') {
        var hElem = document.querySelector('[name="ftp_host"]');
        var uElem = document.querySelector('[name="ftp_user"]');
        var pElem = document.querySelector('[name="ftp_pass"]');
        formData.append('ftp_host', hElem ? hElem.value : "");
        formData.append('ftp_user', uElem ? uElem.value : "");
        formData.append('ftp_pass', pElem ? pElem.value : "");
    }

    fetch('{% url "list_backup_files" %}', {
        method: 'POST',
        headers: { "X-CSRFToken": csrfToken },
        body: formData
    })
    .then(function(response) { return response.json(); })
    .then(function(data) {
        if (responseDisplay) responseDisplay.style.display = 'none';
        if (data.status === 'success' && data.files && data.files.length > 0) {
            if (file_id) file_id.style.display = "block";
            var selectElement = document.getElementById('backup-files-select');
            selectElement.innerHTML = '';
            data.files.forEach(function(file) {
                var option = document.createElement('option');
                option.value = file;
                option.textContent = file;
                selectElement.appendChild(option);
            });
        } else {
            if (alertContainer) {
                alertContainer.style.display = "flex";
                alertContainer.className = "p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs flex items-center justify-between mb-4";
                messageDisplay.innerText = data.message || "No backup files found in this location.";
            }
        }
    })
    .catch(function(error) {
        if (responseDisplay) responseDisplay.style.display = 'none';
        if (alertContainer) {
            alertContainer.style.display = "flex";
            alertContainer.className = "p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs flex items-center justify-between mb-4";
            messageDisplay.innerText = "Failed to fetch backup files. Please try again.";
        }
    });
}

function generateStrongPassword(length) {
    length = length || 16;
    var lowercase = 'abcdefghijklmnopqrstuvwxyz';
    var uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    var digits = '0123456789';
    var specialChars = '!@#$%^&*()_+[]{}|;:,.<>?';
    var all = lowercase + uppercase + digits + specialChars;
    var password = lowercase[Math.floor(Math.random() * lowercase.length)] +
                   uppercase[Math.floor(Math.random() * uppercase.length)] +
                   digits[Math.floor(Math.random() * digits.length)] +
                   specialChars[Math.floor(Math.random() * specialChars.length)];
    for (var i = 4; i < length; i++) {
        password += all[Math.floor(Math.random() * all.length)];
    }
    return password.split('').sort(function() { return Math.random() - 0.5; }).join('');
}

function generateAndFillPassword() {
    var password = generateStrongPassword(16);
    var passElem = document.getElementById('dbpassc');
    if (passElem) passElem.value = password;
    return false;
}

function uploadFile(file) {
    var formData = new FormData();
    formData.append('file', file);
    formData.append('target_name', 'backup');

    $('#file-preview').html(
        '<div id="uploadingFileProgress" class="p-3 border border-slate-200 rounded-lg bg-white text-xs">' +
            '<div class="flex justify-between font-bold text-slate-800 mb-1.5">' +
                '<span class="truncate font-mono">' + file.name + '</span>' +
                '<span class="progress-percentage text-brand font-semibold">0%</span>' +
            '</div>' +
            '<div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">' +
                '<div class="progress-bar bg-brand h-full rounded-full transition-all duration-300" style="width: 0%;"></div>' +
            '</div>' +
        '</div>'
    );

    var progressBar = $('#uploadingFileProgress .progress-bar');
    var progressPercentage = $('#uploadingFileProgress .progress-percentage');

    $.ajax({
        url: upload_url,
        type: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        headers: { "X-CSRFToken": csrfToken },
        xhr: function () {
            var xhr = new window.XMLHttpRequest();
            xhr.upload.addEventListener('progress', function (e) {
                if (e.lengthComputable) {
                    var percentComplete = Math.round((e.loaded / e.total) * 100);
                    progressBar.css('width', percentComplete + '%');
                    progressPercentage.text(percentComplete + '%');
                }
            }, false);
            return xhr;
        },
        success: function (response) {
            progressBar.removeClass('bg-brand').addClass('bg-emerald-600');
            progressPercentage.text('Complete');
            issuebackup(file.name);
        },
        error: function (xhr, status, error) {
            progressBar.removeClass('bg-brand').addClass('bg-rose-600');
            progressPercentage.text('Upload Failed');
        }
    });
}

$('#upload-button').on('click', function () {
    var fileInput = document.getElementById('bk_up');
    var file = (fileInput && fileInput.files) ? fileInput.files[0] : null;
    if (!file) {
        alert('Please select a file to upload.');
        return;
    }
    uploadFile(file);
});

function uploadFileFromUrl(fileUrl, targetPath) {
    var formData = new FormData();
    formData.append('file_url', fileUrl);
    formData.append('target_name', targetPath);

    var progBar = $('#prog');
    var bar = progBar.find('.progress-bar');
    var percentText = $('.upload-item .progress-percentage');

    progBar.show();
    percentText.show();
    bar.css('width', '0%');
    percentText.text('0%');

    $.ajax({
        url: upload_url_from_url,
        type: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        headers: { "X-CSRFToken": csrfToken },
        beforeSend: function () {
            var progress = 0;
            this.interval = setInterval(function () {
                if (progress < 80) {
                    progress += 5;
                    bar.css('width', progress + '%');
                    percentText.text(progress + '%');
                }
            }, 200);
        },
        success: function (response) {
            clearInterval(this.interval);
            bar.css('width', '100%').removeClass('bg-brand').addClass('bg-emerald-600');
            percentText.text('Complete');
            issuebackup(response.file_name);
        },
        error: function () {
            clearInterval(this.interval);
            bar.css('width', '100%').removeClass('bg-brand').addClass('bg-rose-600');
            percentText.text('Failed');
        }
    });
}

$('#upload-button-url').on('click', function () {
    var urlElem = document.getElementById('url-input');
    var url = urlElem ? urlElem.value.trim() : "";
    if (!url) {
        alert('Please enter a direct file URL.');
        return;
    }
    uploadFileFromUrl(url, 'backup');
});

document.addEventListener("DOMContentLoaded", function () {
    var localRadio = document.querySelector('input[name="backup_type"][value="local"]');
    if (localRadio) {
        localRadio.checked = true;
        toggleFtpFields();
    }
});
</script>

{% endblock content %}
