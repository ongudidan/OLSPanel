{% extends "whm/base.html" %}
{% block title %}User File Manager{% endblock title %}
{% block content %}

<div class="max-w-xl bg-white border border-slate-200 rounded-lg shadow-sm mb-5">
    <div class="px-4 py-3 bg-white border-b border-slate-200 rounded-t-lg">
        <h4 class="text-base font-semibold text-slate-900 m-0 flex items-center gap-2">
            <i class="mdi mdi-folder-account text-brand"></i> User File Manager
        </h4>
    </div>
    <div class="p-5">
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="xuser" class="block text-xs font-semibold text-slate-700 mb-1">Select User Account</label>
                <select name="user" id="xuser" required class="searchable-select w-full" data-placeholder="-- Choose a user --" data-search-placeholder="Search users..." data-icon="mdi-account-outline">
                    <option value="" disabled selected>-- Choose a user --</option>
                    {% for auser in all_user %}
                        <option value="{{ auser.username }}" data-icon="mdi-account-outline">{{ auser.username }}</option>
                    {% endfor %}
                </select>
                <div class="text-[11px] text-slate-500 mt-2 flex items-center gap-1">
                    <i class="mdi mdi-information-outline text-brand"></i> This will authenticate directly into the chosen user's home directory.
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="btn btn-secondary inline-flex items-center gap-1.5 text-xs font-semibold rounded-md shadow-sm">
                    <i class="mdi mdi-folder-open-outline"></i> Open File Manager
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock content %}
