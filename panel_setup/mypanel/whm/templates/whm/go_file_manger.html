{% extends "whm/base.html" %}
{% block title %}User File Manager{% endblock title %}
{% block content %}

<div class="max-w-xl bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden mb-5">
    <div class="px-4 py-3 bg-white border-b border-slate-200">
        <h4 class="text-base font-semibold text-slate-900 m-0 flex items-center gap-2">
            <i class="mdi mdi-folder-account text-brand"></i> User File Manager
        </h4>
    </div>
    <div class="p-5">
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="xuser" class="block text-xs font-semibold text-slate-700 mb-1">Select User Account</label>
                <select name="user" id="xuser" required class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                    <option value="" disabled selected>-- Choose a user --</option>
                    {% for auser in all_user %}
                        <option value="{{ auser.username }}">{{ auser.username }}</option>
                    {% endfor %}
                </select>
                <div class="text-[11px] text-slate-500 mt-2 flex items-center gap-1">
                    <i class="mdi mdi-information-outline text-brand"></i> This will authenticate directly into the chosen user's home directory.
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-brand hover:bg-brand/90 rounded-md shadow-xs transition-colors">
                    <i class="mdi mdi-folder-open-outline"></i> Open File Manager
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock content %}
