{% extends "whm/base.html" %}
{% block title %}Manage Domain{% endblock title %}
{% block content %}

<script src="/media/editor/ace.js"></script>

<div class="space-y-5">
    <!-- Domain Settings Card -->
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
        <div class="px-4 py-3 bg-white border-b border-slate-200 flex items-center justify-between">
            <h4 class="text-base font-semibold text-slate-900 m-0 flex items-center gap-2">
                <i class="mdi mdi-domain text-brand"></i> Edit Domain: <span class="text-brand">{{ domain }}</span>
            </h4>
            <div>
                <a href="{% url 'domain_list_all' %}" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors">
                    <i class="mdi mdi-arrow-left"></i> Back to Domains
                </a>
            </div>
        </div>
        <div class="p-5">
            <form method="post" enctype="multipart/form-data" class="space-y-4 max-w-xl">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Domain Name</label>
                    <input type="text" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-md text-xs text-slate-600 cursor-not-allowed shadow-xs font-bold" value="{{ domain }}" readonly>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Document Root (File System Location)</label>
                    <div class="flex items-center rounded-md shadow-xs">
                        <span class="inline-flex items-center px-3 py-2 border border-r-0 border-slate-200 bg-slate-50 text-slate-500 text-xs rounded-l-md">
                            <i class="mdi mdi-home text-sm"></i>
                        </span>
                        <input type="text" id="path" name="path" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-r-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand font-mono transition-all" value="{{ relevant_path }}">
                    </div>
                </div>
                
                <div class="pt-2 flex items-center gap-2.5">
                    <button type="submit" class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-brand hover:bg-brand/90 rounded-md shadow-xs transition-colors">
                        <i class="mdi mdi-content-save-outline"></i> Save Domain
                    </button>
                    <form action="{% url 'domain_delete_all' domain.id %}" method="post" class="inline m-0">
                        {% csrf_token %}
                        <button type="submit" class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-rose-600 hover:bg-rose-700 rounded-md shadow-xs transition-colors" onclick="return confirm('Are you sure you want to delete this domain?');">
                            <i class="mdi mdi-trash-can-outline"></i> Remove Domain
                        </button>
                    </form>
                </div>
            </form>
        </div>
    </div>

    <!-- Virtual Host Configuration Card -->
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
        <div class="px-4 py-3 bg-white border-b border-slate-200 flex items-center justify-between">
            <h4 class="text-base font-semibold text-slate-900 m-0 flex items-center gap-2">
                <i class="mdi mdi-code-tags text-brand"></i> Virtual Host Configuration
            </h4>
            <div id="responseContainer" style="display: none;" class="flex items-center gap-1 text-xs text-brand font-semibold">
                <svg class="animate-spin h-3.5 w-3.5 text-brand" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                <span>Loading...</span>
            </div>
        </div>
        <div class="p-5 space-y-4">
            <div id="alertContainer" style="display: none;" class="p-3 rounded-lg text-xs flex items-center justify-between">
                <div id="message"></div>
                <button type="button" onclick="document.getElementById('alertContainer').style.display='none'" class="text-slate-400 hover:text-slate-600 text-sm font-bold bg-transparent border-0">&times;</button>
            </div>

            <div class="border border-slate-200 rounded-md overflow-hidden">
                <div id="editor" class="w-full h-96 text-xs font-mono"></div>
            </div>

            <div>
                <button id="save" class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-brand hover:bg-brand/90 rounded-md shadow-xs transition-colors">
                    <i class="mdi mdi-content-save-outline"></i> Save Virtual Host
                </button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    load("{{ domain }}");
});

const editor = ace.edit("editor");
editor.setTheme("ace/theme/xcode");
editor.session.setMode("ace/mode/apache_conf");

const alertContainer = document.getElementById('alertContainer');
const messageDisplay = document.getElementById('message');
const responseDisplay = document.getElementById('responseContainer');

function load(domain) {
    if (domain) {
        if (responseDisplay) responseDisplay.style.display = 'flex';
        fetch(`{% url 'fetch_vhost' %}?domain=${domain}`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' },
        })
        .then(response => {
            if (!response.ok) throw new Error('Network response was not ok: ' + response.statusText);
            return response.json();
        })
        .then(response => {
            if (responseDisplay) responseDisplay.style.display = 'none';
            editor.setValue(response.content, -1);
        })
        .catch(error => {
            console.error('Error:', error);
            if (responseDisplay) responseDisplay.style.display = 'none';
        });
    }
}

document.getElementById('save').onclick = function (event) {
    event.preventDefault();
    const content = editor.getValue();
    const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;
    const domain = "{{ domain }}";

    if (responseDisplay) responseDisplay.style.display = 'flex';

    fetch("{% url 'save_vhost' %}", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': csrfToken,
            'X-Requested-With': 'XMLHttpRequest'
        },
        body: new URLSearchParams({
            'content': content,
            'domain': domain
        })
    })
    .then(response => {
        if (responseDisplay) responseDisplay.style.display = 'none';
        if (!response.ok) throw new Error('Network response was not ok: ' + response.statusText);
        return response.json();
    })
    .then(data => {
        if (responseDisplay) responseDisplay.style.display = 'none';
        if (alertContainer && messageDisplay) {
            alertContainer.style.display = 'flex';
            if (data.status === 'success') {
                alertContainer.className = "p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-lg text-xs flex items-center justify-between";
                messageDisplay.innerText = 'Save successful';
            } else {
                alertContainer.className = "p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs flex items-center justify-between";
                messageDisplay.innerText = "Failed: " + data.message;
            }
        }
    })
    .catch(error => {
        console.error('Error:', error);
        if (responseDisplay) responseDisplay.style.display = 'none';
        if (alertContainer && messageDisplay) {
            alertContainer.style.display = 'flex';
            alertContainer.className = "p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs flex items-center justify-between";
            messageDisplay.innerText = 'An error occurred: ' + error.message;
        }
    });
};
</script>

{% include "whm/footer.html" %}
{% endblock content %}
