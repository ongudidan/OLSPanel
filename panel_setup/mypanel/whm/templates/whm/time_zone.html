{% extends "whm/base.html" %}
{% block title %}Time Zone{% endblock title %}
{% block content %}

<div id="responseContainer" style="display: none;" class="p-3 bg-sky-50 border border-sky-200 text-sky-800 rounded-lg text-xs flex items-center gap-2 mb-4">
    <svg class="animate-spin h-4 w-4 text-sky-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
    <span>Saving timezone configuration, please wait...</span>
</div>

<div id="alertContainer" style="display: none;" class="p-3 rounded-lg text-xs flex items-center justify-between mb-4">
    <div id="message"></div>
    <button type="button" onclick="document.getElementById('alertContainer').style.display='none'" class="text-slate-400 hover:text-slate-600 text-sm font-bold bg-transparent border-0">&times;</button>
</div>

<div class="max-w-xl bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden mb-5">
    <div class="px-4 py-3 bg-white border-b border-slate-200">
        <h4 class="text-base font-semibold text-slate-900 m-0 flex items-center gap-2">
            <i class="mdi mdi-clock-outline text-brand"></i> Server Time Zone
        </h4>
    </div>
    <div class="p-5">
        <form id="timezoneForm" method="post" enctype="multipart/form-data" onsubmit="return saveTimezone();" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="time_zone" class="block text-xs font-semibold text-slate-700 mb-1">Select System Timezone</label>
                <select name="time_zone" id="time_zone" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                    {% for zone in timezone %}
                        <option value="{{ zone.timezone }}" {% if nowzone == zone.timezone %}selected{% endif %}>
                            {{ zone.timezone }}
                        </option>
                    {% endfor %}
                </select>
                <div class="text-[11px] text-slate-500 mt-2">
                    Current active timezone: <code class="font-mono bg-slate-100 px-1.5 py-0.5 rounded text-slate-800 border border-slate-200">{{ nowzone }}</code>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-brand hover:bg-brand/90 rounded-md shadow-xs transition-colors">
                    <i class="mdi mdi-content-save-outline"></i> Save Timezone
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function saveTimezone() {
    const loadingContainer = document.getElementById('responseContainer');
    const alertContainer = document.getElementById('alertContainer');
    const messageDiv = document.getElementById('message');
    const timezoneSelect = document.getElementById('time_zone');

    if (alertContainer) alertContainer.style.display = 'none';
    if (loadingContainer) loadingContainer.style.display = 'flex';

    const formData = new URLSearchParams();
    formData.append('time_zone', timezoneSelect.value);

    fetch("{% url 'time_zone' %}", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': '{{ csrf_token }}',
        },
        body: formData.toString(),
    })
    .then(response => response.json())
    .then(data => {
        if (loadingContainer) loadingContainer.style.display = 'none';
        if (alertContainer && messageDiv) {
            if (data.status === 'success') {
                messageDiv.textContent = data.message || 'Timezone updated successfully!';
                alertContainer.className = 'p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-lg text-xs flex items-center justify-between mb-4';
            } else {
                messageDiv.textContent = data.message || 'Failed to update timezone.';
                alertContainer.className = 'p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs flex items-center justify-between mb-4';
            }
            alertContainer.style.display = 'flex';
        }
    })
    .catch(error => {
        if (loadingContainer) loadingContainer.style.display = 'none';
        if (alertContainer && messageDiv) {
            messageDiv.textContent = 'Timezone updated successfully!';
            alertContainer.className = 'p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-lg text-xs flex items-center justify-between mb-4';
            alertContainer.style.display = 'flex';
        }
    });

    return false;
}
</script>

{% endblock content %}
