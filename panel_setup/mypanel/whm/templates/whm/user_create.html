{% extends "whm/base.html" %}
{% block title %}Add User{% endblock title %}

{% block content %}
<div class="max-w-2xl bg-white border border-slate-200 rounded-lg shadow-sm mb-5">
    <div class="px-4 py-3 bg-white border-b border-slate-200">
        <h4 class="text-base font-semibold text-slate-900 m-0 flex items-center gap-2">
            <i class="mdi mdi-account-plus text-brand"></i> Add New User
        </h4>
    </div>
    <div class="p-5">
        <form method="post" action="" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label for="tdomain" class="block text-xs font-semibold text-slate-700 mb-1">Primary Domain</label>
                <input type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="tdomain" name="domain" placeholder="example.com" required>
            </div>

            <div>
                <label for="php_version" class="block text-xs font-semibold text-slate-700 mb-1">Default PHP Version</label>
                <select class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" name="php_version" id="php_version">
                    {% for version in php_versions %}
                        <option value="{{ version }}">PHP {{ version }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label for="firstName" class="block text-xs font-semibold text-slate-700 mb-1">First Name</label>
                    <input name="first_name" type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="firstName" required>
                </div>
                <div>
                    <label for="lastName" class="block text-xs font-semibold text-slate-700 mb-1">Last Name</label>
                    <input name="last_name" type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="lastName" required>
                </div>
            </div>

            <div>
                <label for="username" class="block text-xs font-semibold text-slate-700 mb-1">Username (max 9 characters)</label>
                <input type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="username" name="username" maxlength="9" required>
            </div>

            <div>
                <label for="ttl" class="block text-xs font-semibold text-slate-700 mb-1">Account Email</label>
                <input type="email" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="ttl" name="email" value="" required>
            </div>

            <div>
                <label for="type" class="block text-xs font-semibold text-slate-700 mb-1">Hosting Package</label>
                <select class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all" id="type" name="pkg_id" required>
                    {% for pk in pkg %}
                        <option value="{{ pk.id }}">{{ pk.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <div class="flex">
                    <input type="text" id="password" name="password" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-l-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm transition-all font-mono" placeholder="{{ tips }}">
                    <button id="gen" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold border border-l-0 border-slate-200 rounded-r-md transition-colors whitespace-nowrap" type="button" onclick="return generateAndFillPassword();">Generate</button>
                </div>
            </div>

            <div class="pt-3 flex items-center gap-2">
                <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-md shadow-sm transition-all">
                    <i class="mdi mdi-check mr-1"></i> Add User
                </button>
                <a href="{% url 'user_list_all' %}" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-md transition-all">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script>
const domainInput = document.getElementById('tdomain');
const usernameInput = document.getElementById('username');

// Auto-fill username from domain
domainInput.addEventListener('input', function () {
    let namePart = this.value.trim().split('.')[0];
    namePart = namePart.replace(/[^a-zA-Z0-9]/g, '');
    namePart = namePart.replace(/^[0-9]+/, '');
    namePart = namePart.slice(0, 9).toLowerCase();

    usernameInput.value = namePart;
});

// Restrict manual input
usernameInput.addEventListener('input', function () {
    let value = this.value.replace(/[^a-zA-Z0-9]/g, '');
    value = value.replace(/^[0-9]+/, '');
    this.value = value.slice(0, 9).toLowerCase();
});

function generateStrongPassword(length = 16) {
    const lowercase = 'abcdefghijklmnopqrstuvwxyz';
    const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const digits = '0123456789';
    const allCharacters = lowercase + uppercase + digits;
    let password = '';

    password += lowercase[Math.floor(Math.random() * lowercase.length)];
    password += uppercase[Math.floor(Math.random() * uppercase.length)];
    password += digits[Math.floor(Math.random() * digits.length)];

    for (let i = 3; i < length; i++) {
        password += allCharacters[Math.floor(Math.random() * allCharacters.length)];
    }

    return password.split('').sort(() => Math.random() - 0.5).join('');
}

function generateAndFillPassword() {
    const password = generateStrongPassword();
    document.getElementById('password').value = password;
    return false;
}
</script>
{% endblock content %}
