{% extends "users/base.html" %}
{% block title %}PHP Composer{% endblock title %}
{% block content %}

<div id="responseContainer" style="display: none;" class="p-3 bg-sky-50 border border-sky-200 text-sky-800 rounded-lg text-xs flex items-center gap-2 mb-4">
    <svg class="animate-spin h-4 w-4 text-sky-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
    <span>Running <code class="font-mono font-bold">composer install</code>, please wait...</span>
</div>

<div id="alertContainer" style="display: none;" class="p-3 rounded-lg text-xs flex items-center justify-between mb-4">
    <div id="message"></div>
    <button type="button" onclick="document.getElementById('alertContainer').style.display='none'" class="text-slate-400 hover:text-slate-600 text-sm font-bold bg-transparent border-0">&times;</button>
</div>

<div class="max-w-xl bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden mb-5">
    <div class="px-4 py-3 bg-white border-b border-slate-200">
        <h4 class="text-base font-semibold text-slate-900 m-0 flex items-center gap-2">
            <i class="mdi mdi-cube-send text-brand"></i> Run Composer Dependency Install
        </h4>
    </div>
    <div class="p-5">
        <form method="post" action="" onsubmit="composerInstall(event);" class="space-y-4">
            {% csrf_token %}

            <!-- Select Domain -->
            <div>
                <label for="domainx" class="block text-xs font-semibold text-slate-700 mb-1">Target Domain</label>
                <select name="domain_name" id="domainx" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                    {% for domain in domains %}
                        <option value="{{ domain.path }}">{{ domain.domain }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Document Root -->
            <div>
                <label for="path" class="block text-xs font-semibold text-slate-700 mb-1">Subdirectory / Relative Folder (where composer.json lives)</label>
                <div class="flex items-center rounded-md shadow-xs">
                    <span class="inline-flex items-center px-3 py-2 rounded-l-md border border-r-0 border-slate-200 bg-slate-50 text-slate-500 font-mono text-xs" id="domainPath"></span>
                    <input type="text" id="path" name="target_name" value="{% if edit_mode %}{{ app_path }}{% else %}{{ target_name_simple }}{% endif %}" placeholder="Optional subdirectory (e.g. backend)" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-r-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" id="runCompBtn" class="btn btn-secondary inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white hover:/90 rounded-md shadow-xs transition-colors">
                    <i class="mdi mdi-play"></i> Run Composer Install
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const domainSelect = document.getElementById("domainx");
    const domainPath = document.getElementById("domainPath");

    function updatePathDisplay() {
        if (domainSelect && domainPath) {
            domainPath.textContent = domainSelect.value + "/";
        }
    }

    if (domainSelect) {
        updatePathDisplay();
        domainSelect.addEventListener("change", updatePathDisplay);
    }
});

function composerInstall(event) {
    event.preventDefault();

    const responseDisplay = document.getElementById('responseContainer');
    const alertContainer = document.getElementById('alertContainer');
    const messageDisplay = document.getElementById('message');
    const runBtn = document.getElementById('runCompBtn');

    const inputPath = document.getElementById("path").value.trim();
    const domainSelect = document.getElementById("domainx");
    const spanPath = domainSelect ? domainSelect.value.trim() : "";
    const targetPath = inputPath ? spanPath + "/" + inputPath : spanPath;

    const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]')?.value;

    if (runBtn) {
        runBtn.disabled = true;
        runBtn.innerHTML = `<svg class="animate-spin -ml-0.5 mr-1.5 h-3.5 w-3.5 inline text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg> Running...`;
    }
    if (responseDisplay) responseDisplay.style.display = 'flex';
    if (alertContainer) alertContainer.style.display = 'none';

    fetch('{% url "composer_install_run" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': csrfToken
        },
        body: new URLSearchParams({ 'target_path': targetPath }),
    })
    .then(response => {
        if (!response.ok) throw new Error('Network error: ' + response.statusText);
        return response.json();
    })
    .then(data => {
        if (responseDisplay) responseDisplay.style.display = 'none';
        if (alertContainer && messageDisplay) {
            alertContainer.className = (data.status === 'success') ? "p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-lg text-xs flex items-center justify-between mb-4" : "p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs flex items-center justify-between mb-4";
            messageDisplay.innerText = data.message || "Executed successfully";
            alertContainer.style.display = "flex";
        }
        if (runBtn) {
            runBtn.disabled = false;
            runBtn.innerHTML = `<i class="mdi mdi-play"></i> Run Composer Install`;
        }
    })
    .catch(error => {
        if (responseDisplay) responseDisplay.style.display = 'none';
        if (alertContainer && messageDisplay) {
            alertContainer.className = "p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs flex items-center justify-between mb-4";
            messageDisplay.innerText = "Error: " + error.toString();
            alertContainer.style.display = "flex";
        }
        if (runBtn) {
            runBtn.disabled = false;
            runBtn.innerHTML = `<i class="mdi mdi-play"></i> Run Composer Install`;
        }
    });
}
</script>

{% include "users/footer.html" %}
{% endblock content %}
