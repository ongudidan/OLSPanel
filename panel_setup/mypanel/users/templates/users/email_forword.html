{% extends "users/base.html" %}
{% block title %}Create Email Forwarder{% endblock title %}
{% block content %}

<div class="max-w-3xl space-y-5">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
        <div class="px-5 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between flex-wrap gap-2">
            <h4 class="text-sm font-semibold text-slate-900 m-0 flex items-center gap-2">
                <i class="mdi mdi-email-send-outline text-brand text-base"></i> Create Email Forwarder
            </h4>
            <div>
                <a href="{% url 'email_forword_list' %}" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors">
                    <i class="mdi mdi-arrow-left"></i> Back to Forwarders
                </a>
            </div>
        </div>

        <div class="p-5">
            <form method="post" class="space-y-4 max-w-xl">
                {% csrf_token %}

                <!-- Domain Selector -->
                <div>
                    <label for="domainx" class="block text-xs font-semibold text-slate-700 mb-1">Domain</label>
                    <select id="domainx" name="domain" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all" onchange="updateEmail();">
                        {% for domain in domains %}
                            <option value="{{ domain.id }}">{{ domain.domain }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Username & Suffix -->
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-700 mb-1">Source Email Address</label>
                    <div class="flex items-center rounded-md shadow-xs">
                        <input type="text" id="username" name="username" required placeholder="alias" class="w-full px-3 py-2 bg-white border border-r-0 border-slate-200 rounded-l-md text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand font-mono transition-all">
                        <span id="emailDisplay" class="inline-flex items-center px-3 py-2 border border-slate-200 bg-slate-50 text-slate-600 text-xs font-mono rounded-r-md select-none font-semibold">
                            @example.com
                        </span>
                    </div>
                </div>

                <!-- Destination Email -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-700 mb-1">Forward to Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="destination@example.com" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                </div>

                <div class="pt-2">
                    <button type="submit" class="inline-flex items-center gap-1.5 px-4 py-2 bg-brand hover:bg-brand/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors cursor-pointer">
                        <i class="mdi mdi-check"></i> Create Forwarder
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function updateEmail() {
    const domainSelect = document.getElementById('domainx');
    const domainDisplay = document.getElementById('emailDisplay');
    if (domainSelect && domainDisplay) {
        const domainText = domainSelect.options[domainSelect.selectedIndex]?.text || '';
        if (domainText) {
            domainDisplay.textContent = '@' + domainText;
        }
    }
}

document.addEventListener('DOMContentLoaded', function() {
    updateEmail();
});
</script>

{% include "users/footer.html" %}
{% endblock content %}
