{% extends "users/base.html" %}
{% block title %}Logged Out{% endblock title %}
{% block content %}

<div class="max-w-md mx-auto py-12">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden text-center p-8 space-y-4">
        <div class="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center mx-auto text-slate-500">
            <i class="mdi mdi-logout-variant text-2xl"></i>
        </div>
        <div>
            <h3 class="text-base font-bold text-slate-900 m-0">You have been logged out</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-xs mx-auto leading-relaxed">
                Your session has safely ended. Thank you for using OLSPanel.
            </p>
        </div>
        <div class="pt-2">
            <a href="{% url 'login' %}" class="inline-flex items-center gap-1.5 px-5 py-2.5 bg-brand hover:bg-brand/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors">
                <i class="mdi mdi-login-variant"></i> Sign in again
            </a>
        </div>
    </div>
</div>

{% include "users/footer.html" %}
{% endblock content %}
