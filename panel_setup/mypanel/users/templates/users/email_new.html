{% extends "users/base.html" %}
{% block title %}Create Email Account{% endblock title %}

{% block content %}
<div class="max-w-2xl">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-visible">
        <!-- Card Header -->
        <div class="px-5 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between">
            <h4 class="text-sm font-semibold text-slate-900 m-0 flex items-center gap-2">
                <i class="mdi mdi-email-plus-outline text-brand text-base"></i> Create Email Account
            </h4>
            <a href="{% url 'email_accounts' %}" class="inline-flex items-center gap-1 text-xs font-semibold text-slate-500 hover:text-brand transition-colors">
                <i class="mdi mdi-arrow-left"></i> Back to Email Accounts
            </a>
        </div>

        <!-- Form Body -->
        <div class="p-5">
            <form method="post" class="space-y-4">
                {% csrf_token %}

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Domain Selection -->
                    <div class="space-y-1">
                        <label for="domainx" class="block text-xs font-semibold text-slate-700">Domain Name <span class="text-rose-500">*</span></label>
                        <div>
                            <select id="domainx" name="domain" class="searchable-select w-full" data-placeholder="Select domain..." data-search-placeholder="Search domains..." data-icon="mdi-web">
                                {% for domain in domains %}
                                    <option value="{{ domain.id }}">{{ domain.domain }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Username & Email Preview -->
                    <div class="space-y-1">
                        <label for="username" class="block text-xs font-semibold text-slate-700">Mailbox User <span class="text-rose-500">*</span></label>
                        <div class="flex rounded-md shadow-xs">
                            <input type="text" id="username" name="username" required placeholder="contact, info, support" class="w-full px-3 py-2 bg-white border border-r-0 border-slate-200 rounded-l-md text-xs font-mono text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all" autocomplete="off">
                            <span id="emailSuffix" class="inline-flex items-center px-3 py-2 border border-slate-200 bg-slate-50 text-slate-600 text-xs font-mono rounded-r-md select-none font-semibold whitespace-nowrap shrink-0">
                                @example.com
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Password Fields -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label for="dbpass" class="block text-xs font-semibold text-slate-700">Mailbox Password <span class="text-rose-500">*</span></label>
                        <div class="flex items-center gap-1.5">
                            <input type="text" id="dbpass" name="password" required placeholder="Strong Password" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs font-mono text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
                            <button type="button" onclick="generateAndFillPassword();" class="px-2.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md border border-slate-200 text-xs font-semibold transition-colors shrink-0 cursor-pointer" title="Generate Strong Password">
                                <i class="mdi mdi-refresh text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label for="dbpassc" class="block text-xs font-semibold text-slate-700">Confirm Password <span class="text-rose-500">*</span></label>
                        <input type="text" id="dbpassc" name="passwordc" required placeholder="Repeat Password" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs font-mono text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
                    </div>
                </div>

                <!-- Actions -->
                <div class="pt-2">
                    <button type="submit" class="inline-flex items-center gap-1.5 px-4 py-2 bg-brand hover:bg-brand/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors cursor-pointer">
                        <i class="mdi mdi-plus-circle-outline"></i> Create Email Account
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function updateEmail() {
    const domainSelect = document.getElementById('domainx');
    const domainSuffix = document.getElementById('emailSuffix');
    if (domainSelect && domainSuffix) {
        const domainText = domainSelect.options[domainSelect.selectedIndex]?.text || '';
        if (domainText) {
            domainSuffix.textContent = '@' + domainText;
        }
    }
}

function generateStrongPassword(length = 16) {
    const lowercase = 'abcdefghijklmnopqrstuvwxyz';
    const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const digits = '0123456789';
    const specialChars = '!@#$%^&*()_+[]{}|;:,.<>?';
    const allCharacters = lowercase + uppercase + digits + specialChars;
    let password = '';

    password += lowercase[Math.floor(Math.random() * lowercase.length)];
    password += uppercase[Math.floor(Math.random() * uppercase.length)];
    password += digits[Math.floor(Math.random() * digits.length)];
    password += specialChars[Math.floor(Math.random() * specialChars.length)];

    for (let i = 4; i < length; i++) {
        password += allCharacters[Math.floor(Math.random() * allCharacters.length)];
    }

    return password.split('').sort(() => Math.random() - 0.5).join('');
}

function generateAndFillPassword() {
    const password = generateStrongPassword();
    const p1 = document.getElementById('dbpass');
    const p2 = document.getElementById('dbpassc');
    if (p1) p1.value = password;
    if (p2) p2.value = password;
}

(function initEmailForm() {
    if (window.OLSSelect) {
        window.OLSSelect.initAll(document.getElementById('spa-content') || document);
    }
    const domainSelect = document.getElementById('domainx');
    if (domainSelect) {
        domainSelect.addEventListener('change', updateEmail);
    }
    updateEmail();
})();
</script>

{% include "users/footer.html" %}
{% endblock content %}
