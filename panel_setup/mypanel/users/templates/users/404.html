{% extends "users/base.html" %}
{% block title %}404 - Page Not Found{% endblock title %}
{% block content %}

<div class="max-w-md mx-auto py-12">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden text-center p-8 space-y-4">
        <div class="w-16 h-16 rounded-full bg-red-50 border border-red-200 text-red-600 flex items-center justify-center mx-auto text-2xl font-bold font-mono">
            404
        </div>
        <div>
            <h3 class="text-base font-bold text-slate-900 m-0">Page Not Found</h3>
            <p class="text-xs text-slate-500 mt-2 max-w-xs mx-auto leading-relaxed">
                Oops! The page or resource you are looking for does not exist or has moved.
            </p>
        </div>
        <div class="pt-2">
            <a href="/" class="inline-flex items-center gap-1.5 px-4 py-2 bg-brand hover:bg-brand/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors">
                <i class="mdi mdi-arrow-left"></i> Return to Homepage
            </a>
        </div>
    </div>
</div>

{% include "users/footer.html" %}
{% endblock content %}
