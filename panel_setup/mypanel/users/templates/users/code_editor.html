<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Editor - {{ file }}</title>
    <script src="/media/editor/ace.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/media/editor/smart.css">
    <link rel="stylesheet" href="/media/notify/notification.css">
    <style>
        :root {
            --brand-color: #ef6d19;
            --brand-hover: #d85c0d;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
        }
        #editor {
            position: absolute;
            top: 52px;
            right: 0;
            bottom: 0;
            left: 0;
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <!-- Top Header Bar -->
    <header class="h-[52px] bg-slate-900 border-b border-slate-800 px-4 flex items-center justify-between gap-3 select-none flex-shrink-0 z-10">
        <!-- File Path & Reload -->
        <div class="flex items-center gap-2 flex-1 max-w-xl">
            <span class="text-slate-500 font-mono text-xs hidden sm:inline"><i class="mdi mdi-file-code-outline text-brand text-sm"></i></span>
            <input type="text" id="path" name="path" value="{{ file }}" class="w-full px-2.5 py-1 bg-slate-800 border border-slate-700 rounded text-xs font-mono text-slate-200 focus:outline-none focus:border-brand">
            <button type="button" onclick="reloadPageWithUrl();" id="btnReOpen" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded text-xs font-semibold cursor-pointer transition-colors flex items-center gap-1 flex-shrink-0" title="Re-open File">
                <i class="mdi mdi-refresh"></i> Reopen
            </button>
        </div>

        <!-- Toolbar Buttons -->
        <div class="flex items-center gap-1.5">
            <div class="flex items-center bg-slate-800 border border-slate-700 rounded p-0.5 gap-0.5">
                <button id="search" type="button" class="p-1.5 text-slate-400 hover:text-white rounded hover:bg-slate-700 text-xs transition-colors cursor-pointer" onclick="toggleSearch()" title="Search (Ctrl+F)">
                    <i class="fas fa-search"></i>
                </button>
                <button id="btnGoto" type="button" onclick="toolbarActions('goto')" class="p-1.5 text-slate-400 hover:text-white rounded hover:bg-slate-700 text-xs transition-colors cursor-pointer" title="Go to Line">
                    <i class="fas fa-terminal"></i>
                </button>
                <button id="btnUndo" type="button" onclick="toolbarActions('undo')" class="p-1.5 text-slate-400 hover:text-white rounded hover:bg-slate-700 text-xs transition-colors cursor-pointer" title="Undo (Ctrl+Z)">
                    <i class="fas fa-undo"></i>
                </button>
                <button id="btnRedo" type="button" onclick="toolbarActions('redo')" class="p-1.5 text-slate-400 hover:text-white rounded hover:bg-slate-700 text-xs transition-colors cursor-pointer" title="Redo (Ctrl+Y)">
                    <i class="fas fa-redo"></i>
                </button>
                <button id="btnLineWrap" type="button" onclick="toolbarActions('linewrap')" class="p-1.5 text-slate-400 hover:text-white rounded hover:bg-slate-700 text-xs transition-colors cursor-pointer" title="Toggle Wrap">
                    <i class="fas fa-arrows-alt-h"></i>
                </button>
            </div>

            <!-- Font Size -->
            <select id="ddlFontSizes" class="px-2 py-1 bg-slate-800 border border-slate-700 text-slate-300 rounded text-xs focus:outline-none cursor-pointer">
                <option value="11">11px</option>
                <option value="12">12px</option>
                <option value="13">13px</option>
                <option value="14" selected>14px</option>
                <option value="16">16px</option>
                <option value="18">18px</option>
                <option value="20">20px</option>
            </select>

            <!-- Save Changes Button -->
            <button type="submit" id="sform_submit" class="inline-flex items-center gap-1 px-3 py-1.5 bg-brand hover:bg-brand/90 text-white rounded text-xs font-semibold shadow-xs transition-colors cursor-pointer">
                <img id="responseContainer" style="display: none;" src="/media/loading.gif" width="16" height="16" class="animate-spin" />
                <i class="mdi mdi-content-save"></i> Save
            </button>
            <button type="button" onclick="closeTab();" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white border border-slate-700 rounded text-xs font-semibold transition-colors cursor-pointer">
                Close
            </button>
        </div>
    </header>

    <!-- Search / Replace Container -->
    <div class="flex-item center" id="search-container" style="display:none">
        <div class="ace_search right">
            <span action="hide" onclick="toggleSearch()" class="ace_searchbtn_close"></span>
            <div class="ace_search_form">
                <input class="ace_search_field" id="search-input" placeholder="Search for" spellcheck="false">
                <span id="find-prev" class="ace_searchbtn prev" disabled></span>
                <span id="find-next" class="ace_searchbtn next" disabled></span>
                <span id="find-all" class="ace_searchbtn" title="Alt-Enter">All</span>
            </div>
            <div class="ace_replace_form" style="display: none;">
                <input class="ace_search_field" placeholder="Replace with" spellcheck="false">
                <span action="replaceAndFindNext" class="ace_searchbtn">Replace</span>
                <span action="replaceAll" class="ace_searchbtn">All</span>
            </div>
        </div>
    </div>

    {% csrf_token %}              
    <div id="editor">{{ content }}</div>

    <script>
        const baseUrl = "{{ base_url }}";
        const phpEditorUrl = "{% url 'php_editor' %}";
        const ext = "{{ ext }}";
        
        document.addEventListener('keydown', function(event) {
            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'f') {
                event.preventDefault();
                toggleSearch();
            }
        });
    </script>
    <script src="/media/editor/searchbox.js" defer></script>
    <script src="/media/notify/notify.js"></script>
</body>
</html>
