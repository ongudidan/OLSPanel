{% extends "users/base.html" %}
{% block title %}Manage Database{% endblock title %}
{% block content %}

<div class="max-w-2xl space-y-5">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
        <div class="px-5 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between flex-wrap gap-2">
            <h4 class="text-sm font-semibold text-slate-900 m-0 flex items-center gap-2">
                <i class="mdi mdi-database-edit-outline text-brand text-base"></i> Manage Database: <span class="font-mono text-brand">{{ db_name }}</span>
            </h4>
            <div>
                <a href="{% url 'database_list' %}" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors">
                    <i class="mdi mdi-arrow-left"></i> Back to Databases
                </a>
            </div>
        </div>

        <div class="p-5">
            <form method="post" class="space-y-4 max-w-xl">
                {% csrf_token %}
                <input type="hidden" id="action" name="action" value="edit">

                <div>
                    <label for="dbname" class="block text-xs font-semibold text-slate-700 mb-1">Database Name</label>
                    <div class="flex items-center rounded-md shadow-xs">
                        <span class="inline-flex items-center px-3 py-2 border border-r-0 border-slate-200 bg-slate-50 text-slate-500 text-xs rounded-l-md font-mono font-semibold">
                            {{ user.username }}_
                        </span>
                        <input type="text" id="dbname" name="dbname" value="{{ db_name }}" required class="w-full px-3 py-2 bg-white border border-slate-200 rounded-r-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="inline-flex items-center gap-1.5 px-4 py-2 bg-brand hover:bg-brand/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors cursor-pointer">
                        <i class="mdi mdi-content-save-outline"></i> {{ button|default:"Save Changes"|title }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% include "users/footer.html" %}
{% endblock content %}
