{% extends "users/base.html" %}
{% block title %}Manage Database User{% endblock title %}
{% block content %}

<div class="max-w-2xl space-y-5">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
        <div class="px-5 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between flex-wrap gap-2">
            <h4 class="text-sm font-semibold text-slate-900 m-0 flex items-center gap-2">
                <i class="mdi mdi-account-key-outline text-brand text-base"></i> Manage Database User: <span class="font-mono text-brand">{{ db_name }}</span>
            </h4>
            <div>
                <a href="{% url 'database_list' %}" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors">
                    <i class="mdi mdi-arrow-left"></i> Back to Databases
                </a>
            </div>
        </div>

        <div class="p-5">
            <form method="post" class="space-y-4 max-w-xl">
                {% csrf_token %}

                <!-- Username Field -->
                <div>
                    <label for="dbuser" class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
                    <div class="flex items-center rounded-md shadow-xs">
                        <span class="inline-flex items-center px-3 py-2 border border-r-0 border-slate-200 bg-slate-50 text-slate-500 text-xs rounded-l-md font-mono font-semibold">
                            {{ user.username }}_
                        </span>
                        <input type="text" id="dbuser" name="dbuser" value="{{ db_name }}" required class="w-full px-3 py-2 bg-white border border-slate-200 rounded-r-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label for="dbpass" class="block text-xs font-semibold text-slate-700 mb-1">Password <span class="text-slate-400 font-normal">({{ tips|default:"Enter new password" }})</span></label>
                    <input type="text" id="dbpass" name="dbpass" placeholder="{{ tips|default:'Enter password' }}" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                </div>

                <!-- Confirm Password & Generate -->
                <div>
                    <label for="dbpassc" class="block text-xs font-semibold text-slate-700 mb-1">Confirm Password</label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="dbpassc" name="dbpassc" placeholder="{{ tips|default:'Repeat password' }}" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                        <button type="button" onclick="generateAndFillPassword();" class="shrink-0 px-3 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors cursor-pointer flex items-center gap-1">
                            <i class="mdi mdi-refresh"></i> Generate
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="inline-flex items-center gap-1.5 px-4 py-2 bg-brand hover:bg-brand/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors cursor-pointer">
                        <i class="mdi mdi-content-save-outline"></i> Save User
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function generateStrongPassword(length = 16) {
    const lowercase = 'abcdefghijklmnopqrstuvwxyz';
    const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const digits = '0123456789';
    const specialChars = '!@#$%^&*()_+[]{}|;:,.<>?';
    
    const allCharacters = lowercase + uppercase + digits + specialChars;
    let password = '';

    password += lowercase[Math.floor(Math.random() * lowercase.length)];
    password += uppercase[Math.floor(Math.random() * uppercase.length)];
    password += digits[Math.floor(Math.random() * digits.length)];
    password += specialChars[Math.floor(Math.random() * specialChars.length)];

    for (let i = 4; i < length; i++) {
        password += allCharacters[Math.floor(Math.random() * allCharacters.length)];
    }

    return password.split('').sort(() => Math.random() - 0.5).join('');
}

function generateAndFillPassword() {
    const password = generateStrongPassword();
    document.getElementById('dbpass').value = password;
    document.getElementById('dbpassc').value = password;
}
</script>

{% include "users/footer.html" %}
{% endblock content %}
