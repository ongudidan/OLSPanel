{% extends "users/base.html" %}
{% block title %}Import Database{% endblock title %}
{% block content %}

<div class="max-w-2xl bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden mb-5">
    <div class="px-5 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between flex-wrap gap-2">
        <h4 class="text-sm font-semibold text-slate-900 m-0 flex items-center gap-2">
            <i class="mdi mdi-database-import-outline text-brand text-base"></i> Import Database: <span class="font-mono text-brand">{{ db }}</span>
        </h4>
        <div>
            <a href="{% url 'database_list' %}" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors">
                <i class="mdi mdi-arrow-left"></i> Back to Databases
            </a>
        </div>
    </div>
    <div class="p-5 space-y-4">
        <div>
            <label for="file-input" class="block text-xs font-semibold text-slate-700 mb-1">Select SQL Backup File (.sql / .sql.gz / .zip)</label>
            <input type="file" id="file-input" class="w-full text-xs text-slate-700 file:mr-3 file:py-2 file:px-3.5 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-brand file:text-white hover:file:bg-brand/90 cursor-pointer bg-slate-50 border border-slate-200 rounded-md p-1.5 focus:outline-none focus:border-brand shadow-xs">
            <p class="text-[11px] text-slate-400 mt-1">Maximum file size: 500MB.</p>
        </div>

        <div id="file-preview" class="space-y-2"></div>

        <div class="pt-2">
            <button type="button" id="upload-button" class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-brand hover:bg-brand/90 rounded-md shadow-xs transition-colors cursor-pointer">
                <i class="mdi mdi-upload"></i> Start Import
            </button>
        </div>
    </div>
</div>

<script>
const csrfToken = "{{ csrf_token }}";
const actionUrl = "{% url 'upload_db' db %}";
const fileInput = document.getElementById('file-input');

if (fileInput) {
    fileInput.addEventListener('change', handleFiles);
}

function uploadFile(file, index) {
    const formData = new FormData();
    formData.append('file', file);
   
    const fileId = `file-${file.name.replace(/[^a-zA-Z0-9]/g, '-')}`;
    const progressBar = $(`#${fileId} .progress-bar`);
    const progressPercentage = $(`#${fileId} .progress-percentage`);
    const statusText = $(`#${fileId} .status-text`);

    $.ajax({
        url: actionUrl,
        type: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        headers: { "X-CSRFToken": csrfToken },
        xhr: function () {
            const xhr = new window.XMLHttpRequest();
            xhr.upload.addEventListener('progress', function (e) {
                if (e.lengthComputable) {
                    const percentComplete = Math.round((e.loaded / e.total) * 100);
                    progressBar.css('width', `${percentComplete}%`);
                    progressPercentage.text(`${percentComplete}%`);
                }
            }, false);
            return xhr;
        },
        success: function (response) {
            progressBar.removeClass('bg-brand').addClass('bg-emerald-600');
            progressPercentage.text('100%');
            statusText.text('Import complete!').removeClass('text-slate-500').addClass('text-emerald-700 font-bold');
        },
        error: function (xhr, status, error) {
            progressBar.removeClass('bg-brand').addClass('bg-rose-600');
            progressPercentage.text('Failed');
            statusText.text('Import failed').removeClass('text-slate-500').addClass('text-rose-600 font-bold');
        }
    });
}

$('#upload-button').on('click', function () {
    const files = $('#file-input')[0].files;
    if (!files || files.length === 0) {
        alert('Please select a SQL file to import.');
        return;
    }

    Array.from(files).forEach((file, index) => {
        uploadFile(file, index);
    });
});

function handleFiles(event) {
    const files = event.target.files || event.dataTransfer.files;
    const filePreview = document.getElementById('file-preview');
    if (!filePreview) return;

    filePreview.innerHTML = Array.from(files)
        .map(file => {
            const fileId = `file-${file.name.replace(/[^a-zA-Z0-9]/g, '-')}`;
            return `
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs" id="${fileId}">
                    <div class="flex items-center justify-between font-bold text-slate-800 mb-1.5">
                        <span class="truncate font-mono">${file.name}</span>
                        <span class="text-slate-500 text-[11px]">(${Math.round(file.size / 1024)} KB)</span>
                    </div>
                    <div class="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden mb-1">
                        <div class="progress-bar bg-brand h-full rounded-full transition-all duration-300" style="width: 0%;"></div>
                    </div>
                    <div class="flex items-center justify-between text-[11px] text-slate-500">
                        <span class="status-text">Ready to import</span>
                        <span class="progress-percentage font-semibold">0%</span>
                    </div>
                </div>
            `;
        })
        .join('');
}
</script>
<script src="/media/js/jquery.min.js"></script>

{% include "users/footer.html" %}
{% endblock content %}
