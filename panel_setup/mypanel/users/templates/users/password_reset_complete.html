{% extends "users/base.html" %}
{% block title %}Password Reset Complete{% endblock title %}
{% block content %}

<div class="max-w-md mx-auto py-8">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden text-center p-8 space-y-4">
        <div class="w-16 h-16 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-600 flex items-center justify-center mx-auto">
            <i class="mdi mdi-check-circle text-3xl"></i>
        </div>
        <div>
            <h3 class="text-base font-bold text-slate-900 m-0">Password Reset Successfully</h3>
            <p class="text-xs text-slate-500 mt-2 max-w-xs mx-auto leading-relaxed">
                Your password has been updated. You can now sign in using your new credentials.
            </p>
        </div>
        <div class="pt-2">
            <a href="{% url 'login' %}" class="inline-flex items-center gap-1.5 px-5 py-2.5 bg-brand hover:bg-brand/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors">
                <i class="mdi mdi-login-variant"></i> Proceed to Login
            </a>
        </div>
    </div>
</div>

{% include "users/footer.html" %}
{% endblock content %}
