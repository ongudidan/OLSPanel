{% extends "users/base.html" %}
{% block title %}Add New Subdomain{% endblock title %}
{% block content %}

<div class="max-w-3xl space-y-5">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
        <div class="px-5 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between flex-wrap gap-2">
            <h4 class="text-sm font-semibold text-slate-900 m-0 flex items-center gap-2">
                <i class="mdi mdi-plus-circle-outline text-brand text-base"></i> Add New Subdomain
            </h4>
            <div>
                <a href="{% url 'domain_list' %}" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors">
                    <i class="mdi mdi-arrow-left"></i> Back to Domains
                </a>
            </div>
        </div>

        <div class="p-5">
            <form method="post" action="{% url 'users-domain' %}" enctype="multipart/form-data" class="space-y-4 max-w-xl">
                {% csrf_token %}
                <input type="hidden" name="domain" id="id_domain" required>

                <!-- Select Parent Domain -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1" for="main_domain">Parent Domain</label>
                    <select name="main_domain" id="main_domain" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                        {% for d in domains %}
                            <option value="{{ d.domain }}">{{ d.domain }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Subdomain Name -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1" for="subdomain_prefix">Subdomain</label>
                    <div class="flex items-center rounded-md shadow-xs">
                        <input type="text" id="subdomain_prefix" name="username" placeholder="blog" required class="w-full px-3 py-2 bg-white border border-r-0 border-slate-200 rounded-l-md text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
                        <span id="domainSuffix" class="inline-flex items-center px-3 py-2 border border-slate-200 bg-slate-50 text-slate-600 text-xs font-mono rounded-r-md select-none font-semibold">
                            .example.com
                        </span>
                    </div>
                </div>

                <!-- Document Root -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Document Root (File System Location)</label>
                    <div class="flex items-center rounded-md shadow-xs mb-2">
                        <span class="inline-flex items-center px-3 py-2 border border-r-0 border-slate-200 bg-slate-50 text-slate-500 text-xs rounded-l-md font-mono">
                            /home/{{ user.username }}
                        </span>
                        <input type="text" id="id_path" name="path" value="/public_html" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-r-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
                    </div>
                    <label class="inline-flex items-center gap-2 cursor-pointer text-xs text-slate-600 select-none">
                        <input type="checkbox" id="dtype" name="dtype" class="rounded border-slate-300 text-brand focus:ring-brand">
                        <span>Share main document root (<code class="font-mono text-slate-700">/public_html</code>)</span>
                    </label>
                </div>

                <!-- PHP Version Select -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1" for="php_version">Select PHP Version</label>
                    <select name="php_version" id="php_version" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                        {% for version in php_versions %}
                            <option value="{{ version }}">{{ version }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="pt-2">
                    <button type="submit" class="inline-flex items-center gap-1.5 px-4 py-2 bg-brand hover:bg-brand/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors cursor-pointer">
                        <i class="mdi mdi-check"></i> Add Subdomain
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const prefixInput = document.getElementById("subdomain_prefix");
    const domainSelect = document.getElementById("main_domain");
    const domainSuffix = document.getElementById("domainSuffix");
    const domainInput = document.getElementById("id_domain");
    const checkbox = document.getElementById("dtype");
    const pathInput = document.getElementById("id_path");

    function syncSubdomain() {
        const domain = domainSelect ? domainSelect.value : "";
        const prefix = prefixInput ? prefixInput.value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '') : "";

        if (domainSuffix) {
            domainSuffix.textContent = '.' + (domain || 'example.com');
        }

        if (prefix && domain) {
            domainInput.value = prefix + '.' + domain;
        } else {
            domainInput.value = "";
        }

        updatePath();
    }

    function updatePath() {
        if (!pathInput) return;
        if (checkbox && checkbox.checked) {
            pathInput.value = "/public_html";
        } else if (domainInput && domainInput.value) {
            pathInput.value = `/${domainInput.value}`;
        } else {
            pathInput.value = "/public_html";
        }
    }

    if (prefixInput) prefixInput.addEventListener("input", syncSubdomain);
    if (domainSelect) domainSelect.addEventListener("change", syncSubdomain);
    if (checkbox) checkbox.addEventListener("change", updatePath);

    syncSubdomain();
});
</script>

{% include "users/footer.html" %}
{% endblock content %}
