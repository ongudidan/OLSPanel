{% extends "users/base.html" %}
{% block title %}Add New Subdomain{% endblock title %}

{% block content %}
<div class="max-w-2xl">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-visible">
        <!-- Card Header -->
        <div class="px-5 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between">
            <h4 class="text-sm font-semibold text-slate-900 m-0 flex items-center gap-2">
                <i class="mdi mdi-source-branch text-brand text-base"></i> Add New Subdomain
            </h4>
            <a href="{% url 'domain_list' %}" class="inline-flex items-center gap-1 text-xs font-semibold text-slate-500 hover:text-brand transition-colors">
                <i class="mdi mdi-arrow-left"></i> Back to Domains
            </a>
        </div>

        <!-- Form Body -->
        <div class="p-5">
            <form method="post" action="{% url 'users-domain' %}" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="domain" id="id_domain" required>

                <!-- Parent Domain & Subdomain Prefix Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-12 gap-4">
                    <div class="sm:col-span-6 space-y-1">
                        <label class="block text-xs font-semibold text-slate-700" for="main_domain">Parent Domain <span class="text-rose-500">*</span></label>
                        <div>
                            <select name="main_domain" id="main_domain" class="searchable-select w-full" data-placeholder="Select parent domain..." data-search-placeholder="Search domains..." data-icon="mdi-web" required>
                                {% for d in domains %}
                                    <option value="{{ d.domain }}">{{ d.domain }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="sm:col-span-6 space-y-1">
                        <label class="block text-xs font-semibold text-slate-700" for="subdomain_prefix">Subdomain Prefix <span class="text-rose-500">*</span></label>
                        <div class="flex items-stretch rounded-md shadow-xs">
                            <input type="text" id="subdomain_prefix" name="username" placeholder="e.g. blog" required class="w-full flex-1 min-w-[100px] px-3 py-2 bg-white border border-r-0 border-slate-200 rounded-l-md text-xs font-mono font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all" autocomplete="off">
                            <span id="domainSuffix" class="inline-flex items-center px-3 py-2 border border-slate-200 bg-slate-50 text-slate-600 text-xs font-mono rounded-r-md select-none font-semibold whitespace-nowrap shrink-0">
                                .example.com
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Document Root & PHP Version Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-12 gap-4">
                    <div class="sm:col-span-8 space-y-1">
                        <label class="block text-xs font-semibold text-slate-700" for="id_path">Document Root Directory</label>
                        <div class="flex items-center rounded-md shadow-xs">
                            <span class="inline-flex items-center px-3 py-2 border border-r-0 border-slate-200 bg-slate-50 text-slate-500 text-xs rounded-l-md font-mono select-none">
                                /home/{{ user.username }}
                            </span>
                            <input type="text" id="id_path" name="path" value="/public_html" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-r-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
                        </div>
                    </div>

                    <div class="sm:col-span-4 space-y-1">
                        <label class="block text-xs font-semibold text-slate-700" for="php_version">PHP Version <span class="text-rose-500">*</span></label>
                        <div>
                            <select name="php_version" id="php_version" class="searchable-select w-full" data-placeholder="Select PHP version..." data-search-placeholder="Search PHP versions..." data-icon="mdi-language-php">
                                {% for version in php_versions %}
                                    <option value="{{ version }}">PHP {{ version }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Share Document Root Checkbox -->
                <div class="pt-0.5">
                    <label class="inline-flex items-center gap-1.5 cursor-pointer text-xs text-slate-600 select-none">
                        <input type="checkbox" id="dtype" name="dtype" class="w-3.5 h-3.5 rounded border-slate-300 text-brand focus:ring-brand cursor-pointer">
                        <span>Share main document root (<span class="font-mono text-[11px] font-semibold text-slate-700 bg-slate-100 px-1 py-0.5 rounded border border-slate-200">/public_html</span>)</span>
                    </label>
                </div>

                <!-- Actions -->
                <div class="pt-2">
                    <button type="submit" class="btn btn-secondary inline-flex items-center gap-1.5 px-4 py-2 hover:/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors cursor-pointer">
                        <i class="mdi mdi-plus-circle-outline"></i> Create Subdomain
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function initSubdomainForm() {
    const prefixInput = document.getElementById("subdomain_prefix");
    const domainSelect = document.getElementById("main_domain");
    const domainSuffix = document.getElementById("domainSuffix");
    const domainInput = document.getElementById("id_domain");
    const checkbox = document.getElementById("dtype");
    const pathInput = document.getElementById("id_path");

    // Initialize custom searchable selects
    if (window.OLSSelect) {
        window.OLSSelect.initAll(document.getElementById('spa-content') || document);
    }

    function syncSubdomain() {
        const domain = domainSelect ? domainSelect.value.trim() : "";
        const prefix = prefixInput ? prefixInput.value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '') : "";

        if (domainSuffix) {
            domainSuffix.textContent = domain ? ('.' + domain) : '.example.com';
        }

        if (prefix && domain) {
            if (domainInput) domainInput.value = prefix + '.' + domain;
        } else {
            if (domainInput) domainInput.value = "";
        }

        if (checkbox && pathInput) {
            if (checkbox.checked) {
                pathInput.value = "/public_html";
            } else if (prefix && domain) {
                pathInput.value = `/${prefix}.${domain}`;
            } else {
                pathInput.value = "/public_html";
            }
        }
    }

    if (domainSelect) {
        domainSelect.addEventListener("change", syncSubdomain);
        domainSelect.addEventListener("input", syncSubdomain);
    }
    if (prefixInput) {
        prefixInput.addEventListener("input", syncSubdomain);
    }
    if (checkbox) {
        checkbox.addEventListener("change", syncSubdomain);
    }

    syncSubdomain();
})();
</script>

{% include "users/footer.html" %}
{% endblock content %}
