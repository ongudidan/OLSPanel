{% extends "users/base.html" %}
{% block title %} Login Page {% endblock title %}
{% block content %}

<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="col-12" style="max-width: 380px;">
        <div class="card shadow-sm border bg-white" style="border-radius: 10px; border-color: #e2e8f0 !important;">
            <div class="card-header border-0 bg-transparent pt-4 pb-2 px-4 text-center">
                <div class="d-flex justify-content-center align-items-center w-100">
                    <a href="/" class="d-inline-flex justify-content-center align-items-center">
                        <img src="{{ branding.brand_image }}?v=1.0.7" style="max-height: 52px; max-width: 210px; object-fit: contain; display: block;" alt="{{ branding.brand_title }}">

                    </a>
                </div>
            </div>
            <div class="card-body px-4 pb-4 pt-1">
                {% if form.errors %}
                    <div class="alert alert-danger alert-dismissible fade show text-left mb-3 py-2 px-3 small" role="alert" style="border-radius: 6px;">
                        <div id="form_errors">
                            {% for key, value in form.errors.items %}
                                <strong>{{ value }}</strong>
                            {% endfor %}
                        </div>
                        <button type="button" class="close py-2 px-3" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                {% endif %}
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="form-group mb-3">
                        <label class="small font-weight-bold mb-1" style="color: #334155;">Username</label>
                        {{ form.username }}
                    </div>
                    <div class="form-group mb-3">
                        <label class="small font-weight-bold mb-1" style="color: #334155;">Password</label>
                        {{ form.password }}
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="rememberMeCheck" name="remember_me">
                            <label class="custom-control-label small" for="rememberMeCheck" style="color: #475569;">Remember me</label>
                        </div>
                    </div>
                    <button type="submit" name="login" class="btn btn-primary w-100 font-weight-bold shadow-xs cursor-pointer" style="border-radius: 6px; padding: 7px 14px; font-size: 13px;">Sign In</button>

                </form>
            </div>
        </div>
    </div>
</div>

{% endblock content %}
