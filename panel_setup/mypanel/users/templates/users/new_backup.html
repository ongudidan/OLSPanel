{% extends "users/base.html" %}
{% block title %}Create New Backup{% endblock title %}

{% block content %}
<div class="max-w-2xl">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-visible">
        <!-- Card Header -->
        <div class="px-5 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between">
            <h4 class="text-sm font-semibold text-slate-900 m-0 flex items-center gap-2">
                <i class="mdi mdi-archive-plus-outline text-brand text-base"></i> Create New Backup
            </h4>
            <a href="{% url 'backup' %}" class="inline-flex items-center gap-1 text-xs font-semibold text-slate-500 hover:text-brand transition-colors">
                <i class="mdi mdi-arrow-left"></i> Back to Backups
            </a>
        </div>

        <!-- Form Body -->
        <div class="p-5">
            <!-- Active Loading Alert -->
            <div id="responseContainer" style="display: none;" class="mb-4 p-3 bg-sky-50 border border-sky-200 text-sky-800 rounded-md text-xs flex items-center gap-2 shadow-xs">
                <svg class="animate-spin h-4 w-4 text-sky-600 shrink-0" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                <span class="font-semibold">Backup process in progress. Please do not navigate away from this page...</span>
            </div>

            <!-- Feedback Message Alert -->
            <div id="alertContainer" style="display: none;" class="mb-4 p-3 rounded-md text-xs flex items-center justify-between shadow-xs">
                <div id="message" class="font-medium"></div>
                <button type="button" onclick="document.getElementById('alertContainer').style.display='none'" class="text-slate-400 hover:text-slate-600 text-base font-bold bg-transparent border-0 leading-none">&times;</button>
            </div>

            <form method="post" action="{% url 'new_backup' %}" id="newBackupForm" class="space-y-4">
                {% csrf_token %}

                <!-- Schedule Frequency & Archive Format Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-12 gap-4">
                    <div class="sm:col-span-6 space-y-1">
                        <label class="block text-xs font-semibold text-slate-700" for="common_schedule">Schedule Frequency <span class="text-rose-500">*</span></label>
                        <div>
                            <select id="common_schedule" name="schedule" class="searchable-select w-full" data-placeholder="Select frequency..." data-search-placeholder="Search frequency..." data-icon="mdi-calendar-clock" required>
                                <option value="now">Run Immediately (Now)</option>
                                <option value="hour">Every Hour</option>
                                <option value="day" selected>Every Day</option>
                                <option value="week">Every Week</option>
                                <option value="month">Every Month</option>
                            </select>
                        </div>
                    </div>

                    <div class="sm:col-span-6 space-y-1">
                        <label class="block text-xs font-semibold text-slate-700" for="common_category">Archive Format <span class="text-rose-500">*</span></label>
                        <div>
                            <select id="common_category" name="category" class="searchable-select w-full" data-placeholder="Select format..." data-search-placeholder="Search format..." data-icon="mdi-file-cabinet" required>
                                <option value="default" selected>Standard OLSPanel Format</option>
                                <option value="cyberpanel">CyberPanel Compatible</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Included Backup Components -->
                <div class="space-y-1.5 pt-1">
                    <label class="block text-xs font-semibold text-slate-700">Included Backup Components</label>
                    <div class="flex flex-wrap items-center gap-4 p-3 bg-slate-50 border border-slate-200 rounded-md text-xs">
                        <label class="inline-flex items-center gap-1.5 cursor-pointer font-bold text-slate-900 select-none">
                            <input type="checkbox" id="full_backup" name="backup_option" value="full" onchange="toggleFullBackup(this)" checked class="w-3.5 h-3.5 rounded border-slate-300 text-brand focus:ring-brand cursor-pointer">
                            <span>Full Backup</span>
                        </label>
                        <div class="h-4 w-px bg-slate-200"></div>
                        <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-700 select-none">
                            <input type="checkbox" class="backup-option w-3.5 h-3.5 rounded border-slate-300 text-brand focus:ring-brand cursor-pointer" name="backup_option" value="database" checked>
                            <span>Databases</span>
                        </label>
                        <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-700 select-none">
                            <input type="checkbox" class="backup-option w-3.5 h-3.5 rounded border-slate-300 text-brand focus:ring-brand cursor-pointer" name="backup_option" value="email" checked>
                            <span>Emails</span>
                        </label>
                        <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-700 select-none">
                            <input type="checkbox" class="backup-option w-3.5 h-3.5 rounded border-slate-300 text-brand focus:ring-brand cursor-pointer" name="backup_option" value="dns" checked>
                            <span>DNS Zones</span>
                        </label>
                        <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-700 select-none">
                            <input type="checkbox" class="backup-option w-3.5 h-3.5 rounded border-slate-300 text-brand focus:ring-brand cursor-pointer" name="backup_option" value="files" checked>
                            <span>Website Files</span>
                        </label>
                    </div>
                </div>

                <!-- Storage Destination -->
                <div class="space-y-2 pt-1">
                    <label class="block text-xs font-semibold text-slate-700">Storage Destination</label>
                    <div class="flex items-center gap-5 text-xs">
                        <label class="inline-flex items-center gap-2 cursor-pointer text-slate-800 font-semibold select-none">
                            <input type="radio" name="backup_type" value="local" onchange="toggleFtpFields()" checked class="text-brand focus:ring-brand cursor-pointer">
                            <span class="flex items-center gap-1.5"><i class="mdi mdi-folder-home-outline text-brand text-sm"></i> Local Disk (<code class="font-mono text-[11px] text-slate-700 bg-slate-100 px-1 py-0.5 rounded border border-slate-200">/backup/</code>)</span>
                        </label>
                        <label class="inline-flex items-center gap-2 cursor-pointer text-slate-800 font-semibold select-none">
                            <input type="radio" name="backup_type" value="ftp" onchange="toggleFtpFields()" class="text-brand focus:ring-brand cursor-pointer">
                            <span class="flex items-center gap-1.5"><i class="mdi mdi-server-network text-indigo-600 text-sm"></i> Remote FTP Server</span>
                        </label>
                    </div>

                    <!-- Remote FTP Fields -->
                    <div class="ftp-fields p-3.5 bg-slate-50 border border-slate-200 rounded-md text-xs space-y-3" style="display: none;">
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div class="space-y-1">
                                <label for="ftp_host" class="block text-[11px] font-semibold text-slate-700">FTP Host</label>
                                <input type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all" id="ftp_host" name="ftp_host" placeholder="ftp.example.com">
                            </div>
                            <div class="space-y-1">
                                <label for="ftp_user" class="block text-[11px] font-semibold text-slate-700">FTP Username</label>
                                <input type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all" id="ftp_user" name="ftp_user" placeholder="username">
                            </div>
                            <div class="space-y-1">
                                <label for="ftp_pass" class="block text-[11px] font-semibold text-slate-700">FTP Password</label>
                                <input type="password" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all" id="ftp_pass" name="ftp_pass" placeholder="••••••••">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
                    <a href="{% url 'backup' %}" class="px-3.5 py-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-md text-xs font-semibold transition-colors">
                        Cancel
                    </a>
                    <button type="submit" id="submitBtn" class="inline-flex items-center gap-1.5 px-4 py-2 bg-brand hover:bg-brand/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors cursor-pointer">
                        <i class="mdi mdi-check"></i>
                        <span>Save &amp; Execute Schedule</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function initNewBackupPage() {
    // Initialize custom searchable selects
    if (window.OLSSelect) {
        window.OLSSelect.initAll(document.getElementById('spa-content') || document);
    }

    window.toggleFullBackup = function(source) {
        const checkboxes = document.querySelectorAll('.backup-option');
        checkboxes.forEach(checkbox => {
            checkbox.checked = source.checked;
        });
    };

    window.toggleFtpFields = function() {
        const checkedRadio = document.querySelector('input[name="backup_type"]:checked');
        const isFtp = checkedRadio && checkedRadio.value === 'ftp';
        const ftpContainer = document.querySelector('.ftp-fields');
        if (ftpContainer) {
            ftpContainer.style.display = isFtp ? 'block' : 'none';
        }
    };

    document.querySelectorAll('.backup-option').forEach(checkbox => {
        checkbox.addEventListener('change', function () {
            const fullBackupCheckbox = document.getElementById('full_backup');
            const allChecked = Array.from(document.querySelectorAll('.backup-option')).every(cb => cb.checked);
            if (fullBackupCheckbox) fullBackupCheckbox.checked = allChecked;
        });
    });

    const form = document.getElementById('newBackupForm');
    if (form) {
        form.addEventListener('submit', function (event) {
            const schedule = document.getElementById('common_schedule').value;
            if (schedule === 'now') {
                event.preventDefault();
                saveAndRun();
            }
        });
    }

    function saveAndRun() {
        const formData = new FormData(document.getElementById('newBackupForm'));
        const responseDisplay = document.getElementById('responseContainer');
        const alertContainer = document.getElementById('alertContainer');
        const messageDisplay = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        if (responseDisplay) responseDisplay.style.display = 'flex';
        if (alertContainer) alertContainer.style.display = 'none';
        if (submitBtn) submitBtn.disabled = true;

        fetch("{% url 'backup_now' %}", {
            method: "POST",
            body: formData,
        })
        .then(response => {
            if (!response.ok) return response.text().then(text => { throw new Error(text || "Unknown server error"); });
            return response.text();
        })
        .then(data => {
            if (responseDisplay) responseDisplay.style.display = 'none';
            if (submitBtn) submitBtn.disabled = false;
            if (alertContainer && messageDisplay) {
                alertContainer.className = "mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-md text-xs flex items-center justify-between shadow-xs";
                messageDisplay.innerText = data || "Backup completed successfully!";
                alertContainer.style.display = 'flex';
            }
        })
        .catch(error => {
            if (responseDisplay) responseDisplay.style.display = 'none';
            if (submitBtn) submitBtn.disabled = false;
            if (alertContainer && messageDisplay) {
                alertContainer.className = "mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-md text-xs flex items-center justify-between shadow-xs";
                messageDisplay.innerText = "Error: " + error.message;
                alertContainer.style.display = 'flex';
            }
        });
    }
})();
</script>

{% include "users/footer.html" %}
{% endblock content %}
