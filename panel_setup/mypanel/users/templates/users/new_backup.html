{% extends "users/base.html" %}
{% block title %}New Backup{% endblock title %}
{% block content %}

<div id="responseContainer" style="display: none;" class="p-3 bg-sky-50 border border-sky-200 text-sky-800 rounded-lg text-xs flex items-center gap-2 mb-4">
    <svg class="animate-spin h-4 w-4 text-sky-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
    <span>Backup is running. Please do not navigate away from this page...</span>
</div>

<div id="alertContainer" style="display: none;" class="p-3 rounded-lg text-xs flex items-center justify-between mb-4">
    <div id="message"></div>
    <button type="button" onclick="document.getElementById('alertContainer').style.display='none'" class="text-slate-400 hover:text-slate-600 text-sm font-bold bg-transparent border-0">&times;</button>
</div>

<div class="max-w-2xl bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden mb-5">
    <div class="px-4 py-3 bg-white border-b border-slate-200 flex items-center justify-between">
        <h4 class="text-base font-semibold text-slate-900 m-0 flex items-center gap-2">
            <i class="mdi mdi-archive-plus-outline text-brand"></i> Create New Backup Schedule
        </h4>
        <div>
            <a href="{% url 'backup' %}" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors">
                <i class="mdi mdi-arrow-left"></i> Back
            </a>
        </div>
    </div>
    <div class="p-5">
        <form action="#" method="POST" id="newBackupForm" class="space-y-4">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="common_schedule" class="block text-xs font-semibold text-slate-700 mb-1">Schedule Frequency</label>
                    <select id="common_schedule" name="schedule" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                        <option value="now">Run Immediately (Now)</option>
                        <option value="hour">Every Hour</option>
                        <option value="day" selected>Every Day</option>
                        <option value="week">Every Week</option>
                        <option value="month">Every Month</option>
                    </select>
                </div>

                <div>
                    <label for="common_category" class="block text-xs font-semibold text-slate-700 mb-1">Backup Format</label>
                    <select id="common_category" name="category" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                        <option value="default" selected>Default</option>
                        <option value="cyberpanel">CyberPanel</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Included Components</label>
                <div class="flex flex-wrap gap-4 p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                    <label class="inline-flex items-center gap-1.5 cursor-pointer font-bold text-slate-900">
                        <input type="checkbox" id="full_backup" name="backup_option" value="full" onchange="toggleFullBackup(this)" checked class="rounded border-slate-300 text-brand focus:ring-brand">
                        <span>Full Backup</span>
                    </label>
                    <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-700">
                        <input type="checkbox" class="backup-option rounded border-slate-300 text-brand focus:ring-brand" name="backup_option" value="database" checked>
                        <span>Database</span>
                    </label>
                    <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-700">
                        <input type="checkbox" class="backup-option rounded border-slate-300 text-brand focus:ring-brand" name="backup_option" value="email" checked>
                        <span>Email</span>
                    </label>
                    <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-700">
                        <input type="checkbox" class="backup-option rounded border-slate-300 text-brand focus:ring-brand" name="backup_option" value="dns" checked>
                        <span>DNS</span>
                    </label>
                    <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-700">
                        <input type="checkbox" class="backup-option rounded border-slate-300 text-brand focus:ring-brand" name="backup_option" value="files" checked>
                        <span>Files</span>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Storage Destination</label>
                <div class="flex items-center gap-4 text-xs">
                    <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-800 font-medium">
                        <input type="radio" name="backup_type" value="local" onchange="toggleFtpFields()" checked class="text-brand focus:ring-brand">
                        <span><i class="mdi mdi-folder-home-outline text-brand"></i> Local Storage (/backup/)</span>
                    </label>
                    <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-800 font-medium">
                        <input type="radio" name="backup_type" value="ftp" onchange="toggleFtpFields()" class="text-brand focus:ring-brand">
                        <span><i class="mdi mdi-server-network text-indigo-600"></i> Remote FTP</span>
                    </label>
                </div>

                <div class="ftp-fields mt-3 p-3.5 bg-slate-50 border border-slate-200 rounded-lg text-xs" style="display: none;">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label for="ftp_host" class="block font-semibold text-slate-700 mb-1">FTP Host</label>
                            <input type="text" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all" id="ftp_host" name="ftp_host" placeholder="ftp.example.com">
                        </div>
                        <div>
                            <label for="ftp_user" class="block font-semibold text-slate-700 mb-1">FTP Username</label>
                            <input type="text" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all" id="ftp_user" name="ftp_user" placeholder="username">
                        </div>
                        <div>
                            <label for="ftp_pass" class="block font-semibold text-slate-700 mb-1">FTP Password</label>
                            <input type="password" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all" id="ftp_pass" name="ftp_pass" placeholder="••••••••">
                        </div>
                    </div>
                </div>
            </div>

            <div class="pt-2">
                <button class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-brand hover:bg-brand/90 rounded-md shadow-xs transition-colors" type="submit">
                    <i class="mdi mdi-check"></i> Submit Backup
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('newBackupForm');
    const scheduleSelect = document.getElementById('common_schedule');

    if (form) {
        form.addEventListener('submit', function (e) {
            if (scheduleSelect && scheduleSelect.value === 'now') {
                e.preventDefault();
                issuebackup();
            }
        });
    }
});

function toggleFtpFields() {
    const checkedRadio = document.querySelector('input[name="backup_type"]:checked');
    const ftpFields = document.querySelector('.ftp-fields');
    if (ftpFields && checkedRadio) {
        ftpFields.style.display = (checkedRadio.value === "ftp") ? "block" : "none";
    }
}

function toggleFullBackup(fullBackupCheckbox) {
    const backupOptions = document.querySelectorAll('.backup-option');
    backupOptions.forEach(option => {
        option.checked = fullBackupCheckbox.checked;
    });
}

function issuebackup() {
    const csrfToken = "{{ csrf_token }}";
    const responseDisplay = document.getElementById('responseContainer');
    const alertContainer = document.getElementById('alertContainer');
    const messageDisplay = document.getElementById('message');

    const schedule = document.querySelector('[name="schedule"]')?.value || "now";
    const backupOptions = Array.from(document.querySelectorAll('input[name="backup_option"]:checked')).map(option => option.value);
    const checkedRadio = document.querySelector('input[name="backup_type"]:checked');
    const backupType = checkedRadio ? checkedRadio.value : "local";
    const ftpHost = document.querySelector('[name="ftp_host"]')?.value || "";
    const ftpUser = document.querySelector('[name="ftp_user"]')?.value || "";
    const ftpPass = document.querySelector('[name="ftp_pass"]')?.value || "";
    const category = document.querySelector('[name="category"]')?.value || "default";

    if (responseDisplay) responseDisplay.style.display = 'flex';
    if (alertContainer) alertContainer.style.display = 'none';

    const formData = new FormData();
    formData.append('schedule', schedule);
    formData.append('backup_option', backupOptions.join(','));
    formData.append('backup_type', backupType);
    formData.append('ftp_host', ftpHost);
    formData.append('ftp_user', ftpUser);
    formData.append('ftp_pass', ftpPass);
    formData.append('category', category);

    fetch('{% url 'backup_now' %}', {
        method: 'POST',
        headers: { "X-CSRFToken": csrfToken },
        body: formData
    })
    .then(response => {
        if (!response.ok) throw new Error('Network error: ' + response.statusText);
        return response.text();
    })
    .then(data => {
        if (responseDisplay) responseDisplay.style.display = 'none';
        if (alertContainer && messageDisplay) {
            alertContainer.style.display = 'flex';
            if (data.includes('success')) {
                alertContainer.className = "p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-lg text-xs flex items-center justify-between mb-4";
                messageDisplay.innerText = data;
                setTimeout(() => { window.location.href = '/backup'; }, 3000);
            } else {
                alertContainer.className = "p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs flex items-center justify-between mb-4";
                messageDisplay.innerText = data;
            }
        }
    })
    .catch(error => {
        if (responseDisplay) responseDisplay.style.display = 'none';
        if (alertContainer && messageDisplay) {
            alertContainer.style.display = 'flex';
            alertContainer.className = "p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs flex items-center justify-between mb-4";
            messageDisplay.innerText = error.toString();
        }
    });
}
</script>

{% include "users/footer.html" %}
{% endblock content %}
