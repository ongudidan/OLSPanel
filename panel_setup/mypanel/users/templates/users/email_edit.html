{% extends "users/base.html" %}
{% block title %}Manage Email Account{% endblock title %}
{% block content %}

<div class="max-w-3xl space-y-5">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
        <div class="px-5 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between flex-wrap gap-2">
            <h4 class="text-sm font-semibold text-slate-900 m-0 flex items-center gap-2">
                <i class="mdi mdi-email-edit-outline text-brand text-base"></i> Manage Email Account: <span class="font-mono text-brand">{{ email.email }}</span>
            </h4>
            <div>
                <a href="{% url 'email_accounts' %}" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors">
                    <i class="mdi mdi-arrow-left"></i> Back to Email Accounts
                </a>
            </div>
        </div>

        <div class="p-5">
            <form method="post" class="space-y-4 max-w-xl">
                {% csrf_token %}

                <!-- Email Display (Readonly) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
                    <input type="text" value="{{ email.email }}" readonly class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-md text-xs text-slate-600 font-mono cursor-not-allowed shadow-xs font-bold">
                </div>

                <!-- Password -->
                <div>
                    <label for="dbpass" class="block text-xs font-semibold text-slate-700 mb-1">New Password <span class="text-slate-400 font-normal">(leave blank to keep current)</span></label>
                    <input type="text" id="dbpass" name="password" placeholder="Enter new password..." class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                </div>

                <!-- Confirm Password & Generate -->
                <div>
                    <label for="dbpassc" class="block text-xs font-semibold text-slate-700 mb-1">Confirm New Password</label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="dbpassc" name="passwordc" placeholder="Confirm new password..." class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                        <button type="button" onclick="generateAndFillPassword();" class="shrink-0 px-3 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors cursor-pointer flex items-center gap-1">
                            <i class="mdi mdi-refresh"></i> Generate
                        </button>
                    </div>
                </div>

                <!-- Space Limit (MB) -->
                <div>
                    <label for="spaceLimit" class="block text-xs font-semibold text-slate-700 mb-1">Storage Quota</label>
                    <select id="spaceLimit" name="space_limit" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-xs transition-all">
                        <option value="unlimited">Unlimited</option>
                        <option value="100">100 MB</option>
                        <option value="500">500 MB</option>
                        <option value="1000">1 GB</option>
                        <option value="1500">1.5 GB</option>
                        <option value="2000">2 GB</option>
                        <option value="3000">3 GB</option>
                        <option value="4000">4 GB</option>
                        <option value="5000">5 GB</option>
                    </select>
                </div>

                <div class="pt-3 flex items-center gap-2.5">
                    <button type="submit" class="inline-flex items-center gap-1.5 px-4 py-2 bg-brand hover:bg-brand/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors cursor-pointer">
                        <i class="mdi mdi-content-save-outline"></i> Save Changes
                    </button>
                    <button type="button" onclick="if(confirm('Are you sure you want to delete this email account?')) document.getElementById('deleteEmailForm').submit();" class="inline-flex items-center gap-1.5 px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-md shadow-xs transition-colors cursor-pointer">
                        <i class="mdi mdi-trash-can-outline"></i> Delete Account
                    </button>
                </div>
            </form>

            <form id="deleteEmailForm" action="{% url 'email_delete' email.id %}" method="post" class="hidden">
                {% csrf_token %}
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var diskUsage = {{ email.DiskUsage|default:0 }};
    var spaceLimitSelect = document.getElementById('spaceLimit');
    if (spaceLimitSelect) {
        if (diskUsage === 0 || diskUsage === '0' || diskUsage === 'unlimited') {
            spaceLimitSelect.value = 'unlimited';
        } else {
            spaceLimitSelect.value = diskUsage;
        }
    }
});

function generateStrongPassword(length = 16) {
    const lowercase = 'abcdefghijklmnopqrstuvwxyz';
    const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const digits = '0123456789';
    const specialChars = '!@#$%^&*()_+[]{}|;:,.<>?';
    const allCharacters = lowercase + uppercase + digits + specialChars;
    let password = '';

    password += lowercase[Math.floor(Math.random() * lowercase.length)];
    password += uppercase[Math.floor(Math.random() * uppercase.length)];
    password += digits[Math.floor(Math.random() * digits.length)];
    password += specialChars[Math.floor(Math.random() * specialChars.length)];

    for (let i = 4; i < length; i++) {
        password += allCharacters[Math.floor(Math.random() * allCharacters.length)];
    }

    return password.split('').sort(() => Math.random() - 0.5).join('');
}

function generateAndFillPassword() {
    const password = generateStrongPassword();
    document.getElementById('dbpass').value = password;
    document.getElementById('dbpassc').value = password;
}
</script>

{% include "users/footer.html" %}
{% endblock content %}
