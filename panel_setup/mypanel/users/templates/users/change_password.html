{% extends "users/base.html" %}
{% block title %}Change Password{% endblock title %}

{% block content %}
<div class="max-w-2xl">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
        <!-- Card Header -->
        <div class="px-5 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between">
            <h4 class="text-sm font-semibold text-slate-900 m-0 flex items-center gap-2">
                <i class="mdi mdi-key-outline text-brand text-base"></i> Change Account Password
            </h4>
            <a href="{% url 'users-home' %}" class="inline-flex items-center gap-1 text-xs font-semibold text-slate-500 hover:text-brand transition-colors">
                <i class="mdi mdi-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <!-- Form Body -->
        <div class="p-5">
            <form method="POST" autocomplete="off" class="space-y-4">
                {% csrf_token %}

                <div class="space-y-1">
                    <label for="id_old_password" class="block text-xs font-semibold text-slate-700">Current Password <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <i class="mdi mdi-lock-outline absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="password" name="old_password" id="id_old_password" required placeholder="Enter current password" autocomplete="current-password" class="w-full pl-8 pr-2.5 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label for="id_new_password1" class="block text-xs font-semibold text-slate-700">New Password <span class="text-rose-500">*</span></label>
                        <div class="relative">
                            <i class="mdi mdi-key-plus absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="password" name="new_password1" id="id_new_password1" required placeholder="Min. 6 characters" autocomplete="new-password" class="w-full pl-8 pr-2.5 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label for="id_new_password2" class="block text-xs font-semibold text-slate-700">Confirm New Password <span class="text-rose-500">*</span></label>
                        <div class="relative">
                            <i class="mdi mdi-check-circle-outline absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="password" name="new_password2" id="id_new_password2" required placeholder="Repeat new password" autocomplete="new-password" class="w-full pl-8 pr-2.5 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="pt-2">
                    <button type="submit" id="reset" class="inline-flex items-center gap-1.5 px-4 py-2 bg-brand hover:bg-brand/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors cursor-pointer">
                        <i class="mdi mdi-content-save-outline"></i> Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% include "users/footer.html" %}
{% endblock content %}
