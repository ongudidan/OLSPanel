{% extends "users/base.html" %}
{% block title %}Install {{ name }}{% endblock title %}
{% block content %}

<div class="max-w-2xl space-y-5">
    <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
        <div class="px-5 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between">
            <h4 class="text-sm font-semibold text-slate-900 m-0 flex items-center gap-2">
                <i class="mdi mdi-download-box-outline text-brand text-base"></i> Install {{ name }}
            </h4>
        </div>

        <div class="p-5">
            <form id="installForm" class="space-y-4" onsubmit="event.preventDefault(); installApp();">
                {% csrf_token %}

                <!-- Domain Selection -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1" for="domainx">Target Domain</label>
                    <select name="domainx" id="domainx" required class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
                        <option value="">-- Select domain --</option>
                        {% for domain in domains %}
                            <option value="{{ domain.domain }}">{{ domain.domain }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Document Root Path -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1" for="path">Target Directory Path</label>
                    <div class="flex items-center rounded-md shadow-xs">
                        <span class="inline-flex items-center px-3 py-2 border border-r-0 border-slate-200 bg-slate-50 text-slate-500 text-xs rounded-l-md">
                            <i class="mdi mdi-folder-outline text-xs"></i>
                        </span>
                        <input type="text" id="path" name="path" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-r-md text-xs text-slate-800 font-mono focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all" value="{{ name }}" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" id="save" class="btn btn-secondary inline-flex items-center gap-1.5 px-4 py-2 hover:/90 text-white text-xs font-semibold rounded-md shadow-xs transition-colors cursor-pointer">
                        <i class="mdi mdi-download"></i> Install {{ name }}
                    </button>
                </div>
            </form>

            <!-- Loading Spinner -->
            <div id="responseContainer" style="display: none;" class="p-3.5 bg-sky-50 border border-sky-200 text-sky-800 rounded-lg text-xs flex items-center gap-2.5 mt-4">
                <svg class="animate-spin h-4 w-4 text-sky-600 flex-shrink-0" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                <span>Downloading and installing {{ name }} files, please wait...</span>
            </div>

            <!-- Status Alert -->
            <div id="alertContainer" style="display: none;" class="p-3.5 rounded-lg text-xs flex items-center justify-between shadow-xs mt-4">
                <div id="message" class="font-medium"></div>
            </div>
        </div>
    </div>
</div>

<script>
function installApp() {
    const domainSelect = document.getElementById('domainx');
    const domain = domainSelect ? domainSelect.value : '';
    const path = document.getElementById('path')?.value || '';
    const responseDisplay = document.getElementById('responseContainer');
    const alertContainer = document.getElementById('alertContainer');
    const messageDisplay = document.getElementById('message');
    const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]')?.value;

    if (!domain) {
        if (alertContainer && messageDisplay) {
            alertContainer.className = "p-3.5 bg-red-50 border border-red-200 text-red-800 rounded-lg text-xs flex items-center justify-between shadow-xs mt-4";
            messageDisplay.innerText = "Please select a domain.";
            alertContainer.style.display = "flex";
        }
        return;
    }

    if (responseDisplay) responseDisplay.style.display = 'flex';

    fetch("{% url 'app_install' name=name %}", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': csrfToken
        },
        body: new URLSearchParams({
            'domain_name': domain,
            'target_name': path
        }),
    })
    .then(response => {
        if (responseDisplay) responseDisplay.style.display = 'none';
        if (!response.ok) throw new Error(response.statusText);
        return response.json();
    })
    .then(data => {
        if (alertContainer && messageDisplay) {
            if (data.status === 'success') {
                alertContainer.className = "p-3.5 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-lg text-xs flex items-center justify-between shadow-xs mt-4";
                messageDisplay.innerText = data.message || "{{ name }} installed successfully!";
            } else {
                alertContainer.className = "p-3.5 bg-red-50 border border-red-200 text-red-800 rounded-lg text-xs flex items-center justify-between shadow-xs mt-4";
                messageDisplay.innerText = data.message || "Installation failed.";
            }
            alertContainer.style.display = "flex";
        }
    })
    .catch(error => {
        if (responseDisplay) responseDisplay.style.display = 'none';
        if (alertContainer && messageDisplay) {
            alertContainer.className = "p-3.5 bg-red-50 border border-red-200 text-red-800 rounded-lg text-xs flex items-center justify-between shadow-xs mt-4";
            messageDisplay.innerText = error.message || "An error occurred during installation.";
            alertContainer.style.display = "flex";
        }
    });
}
</script>

{% include "users/footer.html" %}
{% endblock content %}
